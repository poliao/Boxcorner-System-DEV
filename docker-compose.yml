version: '3.8'

services:
  # 1. Database
  db:
    image: postgres:15-alpine
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 2. Backend (Spring Boot)
  backend:
    image: 9near/my-backend:latest     # <--- ต้องใช้ :latest เท่านั้น
    container_name: my-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # 3. Frontend (Angular)
  frontend:
    image: 9near/my-frontend:latest    # <--- ต้องใช้ :latest เท่านั้น
    container_name: my-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data: