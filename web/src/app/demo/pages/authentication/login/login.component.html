<div class="space-container">

  <div class="card-wrapper" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()"
    [style.transform]="'perspective(1000px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg)'">

    <div class="holo-card">

      <div class="scan-line"></div>

      <div class="card-header">
        <i class="fas fa-microchip chip-icon"></i>
        <div class="sys-text">SYS.SEC.L5</div>
      </div>

      <div class="content">
        <div class="title-section">
          <h1 class="nebula-title">BCA SYSTEM</h1>
          <p class="subtitle">SECURE ACCESS GATEWAY</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="input-group">
            <label>USERNAME</label>
            <div class="input-box">
              <i class="fas fa-user icon"></i>
              <input type="text" formControlName="username" placeholder="ENTER USERNAME" autocomplete="off">
              <div class="glow-bar"></div>
            </div>
          </div>

          <div class="input-group">
            <label>PASSWORD</label>
            <div class="input-box">
              <i class="fas fa-lock icon"></i>
              <input type="password" formControlName="password" placeholder="ENTER PASSWORD" pattern="[A-Za-z0-9]*" (keypress)="onPasswordKeyPress($event)">
              <div class="glow-bar"></div>
            </div>
          </div>

          <button type="submit" class="cyber-btn">
            <div class="btn-content">
              <ng-container>
                <span>LOGIN</span>
                <i class="fas fa-arrow-right"></i>
              </ng-container>
            </div>
          </button>
        </form>
      </div>

      <div class="grid-overlay"></div>
    </div>

    <div class="ring-bg ring-cyan"></div>
    <div class="ring-bg ring-purple"></div>
  </div>
</div>
