<div class="row align-items-center mb-4 g-3">
  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center">
      <button mat-icon-button (click)="goBack()" class="me-3">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div>
        <h4 class="mb-0 fw-bold" style="color: #003747;">รายละเอียดงาน QC</h4>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a [routerLink]="['/Dcsm36']" class="text-decoration-none">DCSM36</a></li>
            <li class="breadcrumb-item active">รายละเอียด</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 text-md-end">
    <button mat-flat-button color="primary" class="rounded-pill px-4" (click)="startQc()"
      *ngIf="qcJobForm.get('status')?.value === 'PENDING'">
      <mat-icon class="me-2">play_arrow</mat-icon> เริ่ม QC
    </button>
    <button mat-flat-button color="accent" class="rounded-pill px-4" (click)="completeQc()"
      *ngIf="qcJobForm.get('status')?.value === 'IN_PROGRESS'">
      <mat-icon class="me-2">check_circle</mat-icon> QC แล้ว
    </button>
    <mat-icon class="me-2" (click)="dowloadReportQc()" style="cursor: pointer;"
      *ngIf="qcJobForm.get('status')?.value === 'COMPLETED'">get_app</mat-icon>
    <mat-icon class="me-2" (click)="printReportQc()" style="cursor: pointer;"
      *ngIf="qcJobForm.get('status')?.value === 'COMPLETED'">printer</mat-icon>
  </div>
</div>

<div class="row">
  <div class="col-sm-12">
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <form [formGroup]="qcJobForm" *ngIf="qcJobForm">
          <div class="row g-3">
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">ID ลำดับ</label>
              <input type="text" class="form-control bg-light" formControlName="id" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">JOB ID</label>
              <input type="text" class="form-control bg-light" formControlName="joId" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">สถานะ QC</label>
              <input type="text" class="form-control bg-light text-primary fw-bold" formControlName="status" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">เลขที่ใบส่งของ</label>
              <input type="text" class="form-control bg-light" formControlName="productJobId" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนที่รับมา</label>
              <input type="text" class="form-control bg-light" formControlName="receivedQty" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold" style="color: #ff9900;">วันที่ส่งมอบ</label>
              <input style="background-color: #ff9900;" type="text" class="form-control bg-light"
                formControlName="deliveryDatetime" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนห่อเต็ม</label>
              <input type="text" class="form-control bg-light text-success fw-bold" formControlName="passedQty"
                readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนแพคต่อห่อเต็ม</label>
              <input type="text" class="form-control bg-light" formControlName="bundlesPerPack" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนชิ้นต่อแพค</label>
              <input type="text" class="form-control bg-light" formControlName="boxesPerBundle" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนห่อ(เศษ)</label>
              <input type="text" class="form-control bg-light" formControlName="passedQtyFraction" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนชิ้นต่อแพค(เศษ)</label>
              <input type="text" class="form-control bg-light" formControlName="bundlesPerPackFraction" readonly>
            </div>
            <div class="col-12 col-md-4 col-lg-2">
              <label class="form-label fw-bold">จำนวนชิ้น(เศษ)</label>
              <input type="text" class="form-control bg-light" formControlName="piecesFraction" readonly>
            </div>

            <div class="col-12 col-lg-6">
              <label class="form-label fw-bold">ชื่องาน</label>
              <input type="text" class="form-control bg-light" formControlName="jobName" readonly>
            </div>

            <div class="col-12 col-md-6 col-lg-2">
              <label class="form-label fw-bold text-muted small">วันที่สั่ง</label>
              <input type="text" class="form-control bg-light text-muted small" formControlName="createdAt" readonly>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
              <label class="form-label fw-bold text-muted small">อัพเดตล่าสุด</label>
              <input type="text" class="form-control bg-light text-muted small" formControlName="updatedAt" readonly>
            </div>
            <div class="col-12 col-lg-2">
              <label class="form-label fw-bold">ประเภทQC</label>
              <input type="text" class="form-control bg-light" formControlName="qcType" readonly>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Template for QC Complete Modal -->
  <div id="qcCompleteModalTemplate" style="display: none;">
    <div class="text-start">
      <div class="mb-3">
        <label for="passedQty" class="form-label fw-bold">ยอดงานดี (ชิ้น/แผ่น)</label>
        <input type="number" id="passedQty" class="form-control" placeholder="กรอกจำนวนที่ผ่าน QC">
      </div>
      <div class="mb-3">
        <label for="bundlesPerPack" class="form-label fw-bold">1 ห่อมีกี่มัด</label>
        <input type="number" id="bundlesPerPack" class="form-control" placeholder="กรอกจำนวนมัดต่อห่อ">
      </div>
      <div class="mb-3">
        <label for="boxesPerBundle" class="form-label fw-bold">1 มัดมีกี่กล่อง</label>
        <input type="number" id="boxesPerBundle" class="form-control" placeholder="กรอกจำนวนกล่องต่อมัด">
      </div>
    </div>
  </div>

  <div class="col-sm-12">
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white py-3">
        <h5 class="card-title mb-0" style="color: #003747;"><mat-icon
            class="align-middle me-2">receipt</mat-icon>ข้อมูลใบสั่งผลิตการพิมพ์ (PAP)</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="papOrderForm" *ngIf="papOrderForm">
          <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label fw-bold">จำนวนที่ต้องการ</label>
              <input type="text" class="form-control bg-light" formControlName="qcRequiredQty" readonly>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label fw-bold">ความละเอียดงาน</label>
              <input type="text" class="form-control bg-light" formControlName="qcDetail" readonly>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label fw-bold">เล่มST</label>
              <input type="text" class="form-control bg-light" formControlName="qcBookletSt" readonly>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label fw-bold">ผู้ขาย</label>
              <input type="text" class="form-control bg-light" formControlName="sale" readonly>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label fw-bold">ผู้สั่งผลิต</label>
              <input type="text" class="form-control bg-light" formControlName="orderedBy" readonly>
            </div>
            <div class="col-12 col-md-12 col-lg-12">
              <label class="form-label fw-bold">หมายเหตุ</label>
              <textarea type="text" class="form-control bg-light" formControlName="qcNote" readonly></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Custom Modal for QC Complete -->
<div class="modal-overlay" *ngIf="isCompleteModalOpen">
  <div class="modal-container">
    <div class="modal-header">
      <h5 class="mb-0">QC แล้ว (เสร็จสิ้น)</h5>
      <button type="button" class="btn-close" (click)="closeCompleteModal()"></button>
    </div>
    <div class="modal-body">
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold">จำนวนห่อเต็ม</label>
          <input type="number" id="modalPassedQty" class="form-control" placeholder="จำนวนห่อเต็ม">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold">{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนดวงต่อแผ่น' :
            'จำนวนชิ้นต่อแพค' }}</label>
          <input type="number" id="modalBoxesPerBundle" class="form-control"
            placeholder="{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนดวงต่อแผ่น' : 'จำนวนชิ้นต่อแพค' }}">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold">{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนแผ่นต่อห่อ' :
            'จำนวนแพคต่อห่อ' }}</label>
          <input type="number" id="modalBundlesPerPack" class="form-control"
            placeholder="{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนแผ่นต่อห่อ' : 'จำนวนแพคต่อห่อ' }}">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold">จำนวนห่อ(เศษ)</label>
          <input type="number" id="modalPassedQtyFraction" class="form-control" placeholder="จำนวนห่อเศษ">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label fw-bold"> {{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนแผ่นต่อห่อ(เศษ)' :
            'จำนวนแพคต่อห่อ(เศษ)' }}</label>
          <input type="number" id="modalBundlesPerPackFraction" class="form-control"
            placeholder="{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนแผ่นต่อห่อ(เศษ)' : 'จำนวนแพคต่อห่อ(เศษ)' }}">
        </div>
        <div class="col-12 col-md-4" *ngIf="qcJobForm.get('qcType')?.value != 'QC STK'">
          <label class="form-label fw-bold">จำนวนชิ้น(เศษ)</label>
          <input type="number" id="modalPiecesFraction" class="form-control" placeholder="จำนวนชิ้น(เศษ)">
        </div>
      </div>

      <hr>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <a class="nav-link cursor-pointer" [class.active]="activeTab === 'staff'" (click)="activeTab = 'staff'">พนักงาน QC</a>
        </li>
        <li class="nav-item">
          <a class="nav-link cursor-pointer" [class.active]="activeTab === 'waste'" (click)="activeTab = 'waste'">รายงานความผิดพลาด</a>
        </li>
      </ul>

      <div *ngIf="activeTab === 'staff'">
        <h6 class="fw-bold mb-3">พนักงานQC/กรอกจำนวนห่อที่QC</h6>
        <div class="staff-row mb-3 pb-3 border-bottom" *ngFor="let staff of qcStaffList; let i = index">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-3">
              <label class="form-label small fw-bold">ผู้ QC</label>
              <select class="form-select" [(ngModel)]="staff.userId" (change)="onStaffUserChange(i, $event)">
                <option value="">เลือกพนักงาน</option>
                <option *ngFor="let user of usersList" [value]="user.value">{{user.text}}</option>
              </select>
            </div>
            <div class="col-5 col-md-2">
              <label class="form-label small fw-bold">จำนวนห่อ </label>
              <input type="number" class="form-control" [(ngModel)]="staff.packs" placeholder="ห่อ">
            </div>
            <div class="col-5 col-md-2">
              <label class="form-label small fw-bold">จำนวนห่อ(เศษ)</label>
              <input type="number" class="form-control" [(ngModel)]="staff.packsFraction" placeholder="ห่อ(เศษ)">
            </div>
            <div class="col-5 col-md-2">
              <label class="form-label small fw-bold">{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'จำนวนแผ่น(เศษ)' :
                'จำนวนแพค(เศษ)' }}</label>
              <input type="number" class="form-control" [(ngModel)]="staff.bundlesFraction" placeholder="{{ qcJobForm.get('qcType')?.value === 'QC STK' ? 'แผ่น(เศษ)' :
                'แพค(เศษ)' }}">
            </div>
            <div class="col-5 col-md-2" *ngIf="qcJobForm.get('qcType')?.value != 'QC STK'">
              <label class="form-label small fw-bold">จำนวนชิ้น(เศษ)</label>
              <input type="number" class="form-control" [(ngModel)]="staff.piecesFraction" placeholder="ดวง/ชิ้น">
            </div>
            <div class="col-2 col-md-1 text-end">
              <button class="btn btn-outline-danger btn-sm rounded-circle" (click)="removeStaffRow(i)"
                [disabled]="qcStaffList.length === 1">
                <mat-icon style="font-size: 18px; width: 18px; height: 18px;">delete</mat-icon>
              </button>
            </div>
          </div>
        </div>
        <button mat-stroked-button color="primary" class="w-100 mt-2" (click)="addStaffRow()">
          <mat-icon>add</mat-icon> เพิ่มคน
        </button>
      </div>

      <div *ngIf="activeTab === 'waste'">
        <h6 class="fw-bold mb-3">รายงานของเสียรายแผนก</h6>
        <div class="waste-row mb-3 pb-3 border-bottom" *ngFor="let waste of qcWasteList; let i = index">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-3">
              <label class="form-label small fw-bold">แผนก/งาน</label>
              <select class="form-select" [(ngModel)]="waste.processName">
                <option value="">เลือกงาน</option>
                <option value="งานพิมพ์">งานพิมพ์</option>
                <option value="งานเคลือบ">งานเคลือบ</option>
                <option value="งานปั้ม">งานปั้ม</option>
                <option value="งานปะ">งานปะ</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small fw-bold">ช่างยอดที่เสีย</label>
              <input type="text" class="form-control" [(ngModel)]="waste.technicianName" placeholder="ชื่อช่าง">
            </div>
            <div class="col-4 col-md-2">
              <label class="form-label small fw-bold">จำนวนเสีย</label>
              <input type="number" class="form-control" [(ngModel)]="waste.wasteQty" placeholder="จำนวน">
            </div>
            <div class="col-10 col-md-3">
              <label class="form-label small fw-bold">หมายเหตุ</label>
              <input type="text" class="form-control" [(ngModel)]="waste.remarks" placeholder="ระบุเหตุผล">
            </div>
            <div class="col-2 col-md-1 text-end">
              <button class="btn btn-outline-danger btn-sm rounded-circle" (click)="removeWasteRow(i)"
                [disabled]="qcWasteList.length === 1">
                <mat-icon style="font-size: 18px; width: 18px; height: 18px;">delete</mat-icon>
              </button>
            </div>
          </div>
        </div>
        <button mat-stroked-button color="accent" class="w-100 mt-2" (click)="addWasteRow()">
          <mat-icon>add_circle</mat-icon> เพิ่มรายการของเสีย
        </button>
      </div>
    </div>
    <div class="modal-footer">
      <button mat-button class="me-2" (click)="closeCompleteModal()">ยกเลิก</button>
      <button mat-flat-button color="primary" (click)="onSubmitComplete()">บันทึกข้อมูล</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="isStartModalOpen">
  <div class="modal-container" style="max-width: 500px;">
    <div class="modal-header">
      <h5 class="mb-0">เริ่ม QC</h5>
      <button type="button" class="btn-close" (click)="closeStartModal()"></button>
    </div>
    <div class="modal-body">
      <div class="mb-4">
        <label class="form-label fw-bold">ประเภท QC</label>
        <select class="form-select" [(ngModel)]="selectedQcType">
          <option value="ปะ+QC">ปะ+QC</option>
          <option value="QC BOX">QC BOX</option>
          <option value="QC STK">QC STK</option>
          <option value="ปะมือ">ปะมือ</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">จำนวนที่รับมา</label>
        <input type="number" class="form-control" [(ngModel)]="modalReceivedQty"
          [disabled]="qcJobForm.get('receivedQty')?.value > 0" placeholder="กรอกจำนวนที่รับมา">
      </div>
    </div>
    <div class="modal-footer">
      <button mat-button class="me-2" (click)="closeStartModal()">ยกเลิก</button>
      <button mat-flat-button color="primary" (click)="onSubmitStart()">เริ่ม QC</button>
    </div>
  </div>
</div>
