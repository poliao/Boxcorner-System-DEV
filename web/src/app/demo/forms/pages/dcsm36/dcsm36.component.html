<h2>ตารางรายงานงาน QC (DCSM36)</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <form>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label small fw-bold">JOB ID</label>
            <input type="text" class="form-control" [(ngModel)]="searchParams.joId" name="joId"
              placeholder="ค้นหา Job ID" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">ชื่องาน</label>
            <input type="text" class="form-control" [(ngModel)]="searchParams.jobName" name="jobName"
              placeholder="ค้นหา ชื่องาน" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">สถานะ QC</label>
            <select class="form-select" [(ngModel)]="searchParams.status" name="status" (change)="onSearchChange()">
              <option value="">ทั้งหมด</option>
              <option value="รอส่งตรวจ">รอส่งตรวจ</option>
              <option value="เข้าตรวจแล้ว">เข้าตรวจแล้ว</option>
              <option value="อยู่ระหว่างตรวจ">อยู่ระหว่างตรวจ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">ประเภท QC</label>
            <select class="form-select" [(ngModel)]="searchParams.qcType" name="qcType" (change)="onSearchChange()">
              <option value="">ทั้งหมด</option>
              <option value="ปะเครื่อง+Qc">ปะเครื่อง+Qc</option>
              <option value="ปะมือ+Qc">ปะมือ+Qc</option>
              <option value="Qc Box">Qc Box</option>
              <option value="Qc STK">Qc STK</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label small fw-bold">วันที่งานเข้า (จาก)</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.startFrom" name="startFrom"
              (change)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">วันที่งานเข้า (ถึง)</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.startTo" name="startTo"
              (change)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">กำหนดส่ง (จาก)</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.deliveryFrom" name="deliveryFrom"
              (change)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">กำหนดส่ง (ถึง)</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.deliveryTo" name="deliveryTo"
              (change)="onSearchChange()">
          </div>

          <div class="col-12 mt-2">
            <div class="row g-2 justify-content-end">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-4" style="background-color: #003747;"
                  (click)="onSearchChange()">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button type="button" class="w-100 px-4" (click)="clearAllFilters()"
                  style="color: #003747;">
                  <mat-icon>refresh</mat-icon> ล้างค่า
                </button>
              </div>

              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <div class="position-relative">
                  <button mat-flat-button type="button" class="w-100 px-4 btn text-white"
                    style="background-color: #003747;" (click)="filterJobsToDo()">
                    <span *ngIf="qcCounts.jobsToDo > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      style="font-size: 0.75rem; border: 2px solid #fff;">
                      {{ qcCounts.jobsToDo }}
                    </span>
                    <mat-icon>assignment</mat-icon> งานที่ต้องทำ
                  </button>
                </div>
              </div>

              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <div class="position-relative">
                  <button mat-flat-button type="button" class="w-100 px-4 btn text-white"
                    style="background-color: #d32f2f;" (click)="filterJobsToSend()">
                    <span *ngIf="qcCounts.jobsToSend > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark"
                      style="font-size: 0.75rem; border: 2px solid #fff;">
                      {{ qcCounts.jobsToSend }}
                    </span>
                    <mat-icon>event_available</mat-icon> งานที่ต้องส่ง
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #003747; color: #ffffff;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    [rowStyles]="getRowStyles" (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
