<h2>ตารางรายงานงาน QC (DCSM36)</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <form>
        <div class="row g-3">
          <div class="col-md-3">
            <label for="startDate">วันที่ส่งจาก</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.startDate" name="startDate"
                   placeholder="วันที่เริ่ม" (change)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label for="endDate">ถึงวันที่</label>
            <input type="date" class="form-control" [(ngModel)]="searchParams.endDate" name="endDate"
                   placeholder="วันที่สิ้นสุด" (change)="onSearchChange()">
          </div>
          <div class="col-12 mt-3">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3" style="background-color: #003747;"
                        (click)="onSearchChange()">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button type="button" class="w-100 px-3" (click)="clearAllFilters()"
                        style="color: #003747;">
                  <mat-icon>refresh</mat-icon> ล้างค่า
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table 
    [headerStyle]="'background: #003747; color: #ffffff;'" 
    [columns]="tableColumns" 
    [data]="tableData"
    [totalElements]="totalElements" 
    [pageSize]="pageSize" 
    [pageIndex]="pageIndex" 
    [clickableColumn]="'id'"
    (pageChange)="onPageChange($event)" 
    (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
