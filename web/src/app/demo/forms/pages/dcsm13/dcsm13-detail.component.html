<form [formGroup]="coatingForm" (ngSubmit)="onSubmit()">
  <div class="card-body">
    <div class="card total-income-card warning overflow-hidden">
      <div class="position">
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
      <div class="padding">
        <h5 class="card-title mb-3">บันทึกงานเคลือบ (Coating)</h5>
        
        <div class="row g-3">
          <div class="col-md-2">
            <label class="form-label">ลำดับ</label>
            <input type="number" class="form-control" formControlName="id" >
          </div>

          <div class="col-md-2">
            <label class="form-label">วันที่รายงาน</label>
            <input type="date" class="form-control" formControlName="reportDate" 
              [class.is-invalid]="coatingForm.get('reportDate')?.invalid && coatingForm.get('reportDate')?.touched">
          </div>

          <div class="col-md-2">
            <label class="form-label">เลขที่ใบสั่งงาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="jobOrderNo" 
              [class.is-invalid]="coatingForm.get('jobOrderNo')?.invalid && coatingForm.get('jobOrderNo')?.touched">
          </div>

          <div class="col-md-6">
            <label class="form-label">ชื่องาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="jobName" 
              [class.is-invalid]="coatingForm.get('jobName')?.invalid && coatingForm.get('jobName')?.touched">
          </div>

          <div class="col-md-2">
            <label class="form-label">ประเภทการเคลือบ<span style="color: red;">*</span></label>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="coatingType" value="glossy" id="glossy">
              <label class="form-check-label" for="glossy">เคลือบเงา (Glossy OPP)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="coatingType" value="matte" id="matte">
              <label class="form-check-label" for="matte">เคลือบด้าน (Matte OPP)</label>
            </div>
          </div>

          <div class="col-md-2">
            <label class="form-label">เวลาเริ่มต้น<span style="color: red;">*</span></label>
            <input type="time" class="form-control" formControlName="startTime" 
              (change)="calculateTotalTime()"
              [class.is-invalid]="coatingForm.get('startTime')?.invalid && coatingForm.get('startTime')?.touched">
          </div>

          <div class="col-md-2">
            <label class="form-label">เวลาสิ้นสุด<span style="color: red;">*</span></label>
            <input type="time" class="form-control" formControlName="endTime" 
              (change)="calculateTotalTime()"
              [class.is-invalid]="coatingForm.get('endTime')?.invalid && coatingForm.get('endTime')?.touched">
          </div>

          <div class="col-md-3">
            <label class="form-label">เวลารวม</label>
            <input type="text" class="form-control bg-light" formControlName="totalTime">
          </div>

          <div class="col-md-3">
            <label class="form-label">จำนวน<span style="color: red;">*</span></label>
            <input type="number" class="form-control" formControlName="quantity" 
              [class.is-invalid]="coatingForm.get('quantity')?.invalid && coatingForm.get('quantity')?.touched">
          </div>

          <div class="col-md-6">
            <label class="form-label">ชื่อผู้รายงาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="reporterName" 
              [class.is-invalid]="coatingForm.get('reporterName')?.invalid && coatingForm.get('reporterName')?.touched">
          </div>

          <div class="col-md-12">
            <label class="form-label">หมายเหตุ</label>
            <textarea class="form-control" formControlName="remarks" rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
