<div class="container-fluid py-3">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">📦 สต็อกกระดาษ (Paper Inventory)</h5>
        <button class="btn btn-success" (click)="add()">
          <mat-icon style="vertical-align:middle;font-size:18px;">add</mat-icon> เพิ่มสต็อก
        </button>
      </div>

      <!-- Search -->
      <div class="row mb-3">
        <div class="col-md-5">
          <input type="text" class="form-control" placeholder="ชื่อสินค้า" [(ngModel)]="searchParams.itemName"
            (keyup.enter)="onSearch()">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="ประเภท" [(ngModel)]="searchParams.category"
            (keyup.enter)="onSearch()">
        </div>
        <div class="col-md-3 d-flex gap-1">
          <button class="btn btn-primary btn-sm flex-fill" (click)="onSearch()">ค้นหา</button>
          <button class="btn btn-outline-secondary btn-sm" (click)="clearSearch()">ล้าง</button>
        </div>
      </div>

      <!-- Table -->
      <app-data-table [columns]="tableColumns" [data]="tableData" [totalElements]="totalElements" [pageSize]="pageSize"
        [pageIndex]="pageIndex" [clickableColumn]="'itemName'" (pageChange)="onPageChange($event)"
        (rowClick)="onRowClick($event)">
      </app-data-table>
    </div>
  </div>
</div>
