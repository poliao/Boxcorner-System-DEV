<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="font-weight-bold text-dark m-0">ตารางคอนเฟิร์มรอผลิต</h2>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body bg-light rounded">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="row g-3">

          <div class="col-md-3">
            <input type="number" class="form-control" formControlName="id" placeholder="ค้นหา ลำดับ">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" formControlName="folderName" placeholder="ค้นหา ชื่อโฟลเดอร์">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" formControlName="jobType" placeholder="ค้นหา ประเภทงาน">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" formControlName="jobOwner" placeholder="ค้นหา เจ้าของงาน">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" formControlName="responsiblePerson" placeholder="ค้นหา ผู้รับผิดชอบ">
          </div>

          <div class="col-md-3">
            <select class="form-select" formControlName="status">
              <option value="">สถานะงาน ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน </option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
          </div>

          <div class="col-md-3">
            <select class="form-select" formControlName="processStatus">
              <option value="">สถานะดำเนินการ ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน </option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
              <option value="เสร็จสิ้น รอตรวจสอบ">เสร็จสิ้น รอตรวจสอบ</option>
              <option value="ตรวจไฟล์แม่พิมพ์แล้ว">ตรวจไฟล์แม่พิมพ์แล้ว</option>
              <option value="ตรวจใบสั่งผลิตแล้ว">ตรวจใบสั่งผลิตแล้ว</option>
              <option value="ส่งใบสั่งผลิตแล้ว">ส่งใบสั่งผลิตแล้ว</option>
              <option value="ส่งไฟล์แล้ว">ส่งไฟล์แล้ว</option>
            </select>
          </div>

          <div class="col-md-3">
            <select class="form-select" formControlName="moldStatus">
              <option value="">สถานะแม่พิมพ์ ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน	</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังทำแม่พิมพ์">กำลังทำแม่พิมพ์</option>
              <option value="แม่พิมพ์เสร็จแล้ว">แม่พิมพ์เสร็จแล้ว</option>
              <option value="ส่งแม่พิมพ์">ส่งแม่พิมพ์</option>
            </select>
          </div>

          <div class="col-12">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="btn text-white px-4 w-100" (click)="onClear()" style="background-color: #350142;">
                  <mat-icon>clear_all</mat-icon> ล้างค่า
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="submit" class="btn text-white px-4 w-100" style="background-color: #350142;">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button type="button" mat-flat-button class="btn text-white px-4 w-100" (click)="onSearchSort()"
                  style="background-color: #350142;">
                  <mat-icon>sort</mat-icon> <span class="d-none d-lg-inline">เรียงตามวันส่งลูกค้า</span><span class="d-lg-none">เรียงตาม</span>
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <div class="position-relative">
                  <button mat-flat-button class="btn text-white px-4 w-100" (click)="onFilterUnassigned()" style="background-color: #350142;">
                    <span *ngIf="countBacklog > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      style="font-size: 0.75rem; border: 2px solid #fff;">
                      {{ countBacklog }}
                      <span class="visually-hidden">unread messages</span>
                    </span>
                    <mat-icon>search</mat-icon> <span class="d-none d-lg-inline">งานที่ยังไม่มีผู้รับผิดชอบ</span><span class="d-lg-none">ไม่มีผู้รับผิดชอบ</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #350142; color: #ffffff;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>

</div>
