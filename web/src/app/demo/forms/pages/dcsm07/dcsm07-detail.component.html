<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="isBtnSave == true" (click)="onSubmit()" type="submit" class="btn text-white px-5 shadow-sm"
            style="background-color: #1e1b4b;">
            บันทึกข้อมูล
          </button>
          <button *ngIf="isCancel == true" type="button" class="btn text-white px-5 shadow-sm"
            (click)="updateCancelStatus()" style="background-color: #ff0000;">
            ยกเลิกงานรอผลิต
          </button>
          <button type="button" class="btn text-white px-5 shadow-sm" 
          style="background-color: #ff9100;" (click)="openDeadlineModal()">
            เปลี่ยนวันส่ง
          </button>
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="id" class="form-control">
        </div>
        <div *ngIf="isSampleOrderId == true" class="col-md-6">
          <label class="form-label font-weight-bold">อ้างอิงตารางตัวอย่าง</label>
          <input type="text" formControlName="sampleOrderId" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="date" formControlName="orderDate" class="form-control"
            [class.is-invalid]="mainForm.get('order_date')?.invalid && mainForm.get('order_date')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน</label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="mainForm.get('folder_name')?.invalid && mainForm.get('folder_name')?.touched">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ใช้ไฟล์</label>
          <input type="text" formControlName="usedFile" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สีตัวอย่าง</label>
          <input type="text" formControlName="colorSample" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ส่งงานลูกค้า</label>
          <div class="input-group">
            <input type="date" formControlName="deadlineDate" class="form-control" readonly>
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาส่งงานลูกค้า</label>
          <div class="input-group">
            <input type="time" formControlName="deadlineTime" class="form-control" readonly>
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ผู้รับผิดชอบต้องส่ง<span style="color: red;">*</span></label>
          <input type="date" formControlName="deliveryDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะงาน</label>
          <input type="text" formControlName="jobStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะดำเนินการ</label>
          <input type="text" formControlName="processStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะแม่พิมพ์</label>
          <input type="text" formControlName="moldStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ <span style="color: red;">*</span></label>
          <select formControlName="operatorName" class="form-control form-select">
            <option value="" disabled selected>-- เลือกผู้รับผิดชอบ --</option>
            <option *ngFor="let option of operatorOptions" [value]="option.value">
              {{ option.text }}
            </option>
          </select>
          <div class="invalid-feedback">
            กรุณาเลือกผู้รับผิดชอบ
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ประเภทงาน<span style="color: red;">*</span></label>
          <select formControlName="jobType" class="form-control form-select">
            <option value="" disabled selected>-- เลือกประเภทงาน --</option>
            <option value="OD">OD</option>
            <option value="OS">OS</option>
            <option value="Supplier">Supplier</option>
          </select>
        </div>
        <div class="col-md-9">
          <label class="form-label font-weight-bold">ชื่อลูกค้า</label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า">
        </div>
        <div class="col-md-9">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <input type="text" formControlName="remarks" class="form-control">
        </div>

      </form>
    </div>
  </div>
</div>

<!-- Modal สำหรับเปลี่ยนวันที่และเวลาส่งงานลูกค้า -->
<div class="modal" [class.show]="showDeadlineModal" [style.display]="showDeadlineModal ? 'block' : 'none'"
  style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">เปลี่ยนวันที่และเวลาส่งงานลูกค้า</h5>
        <button type="button" class="btn-close" (click)="closeDeadlineModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">วันที่ส่งงานลูกค้า</label>
            <input type="date" class="form-control" [(ngModel)]="tempDeadlineDate"
              [ngModelOptions]="{standalone: true}">
          </div>
          <div class="col-md-6">
            <label class="form-label">เวลาส่งงานลูกค้า</label>
            <input type="time" class="form-control" [(ngModel)]="tempDeadlineTime"
              [ngModelOptions]="{standalone: true}">
          </div>
        </div>
        <div class="alert alert-info mt-3">
          <strong>วันที่ปัจจุบัน:</strong> {{ mainForm.get('deadlineDate')?.value || '-' }}<br>
          <strong>เวลาปัจจุบัน:</strong> {{ mainForm.get('deadlineTime')?.value || '-' }}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDeadlineModal()">ยกเลิก</button>
        <button type="button" class="btn btn-primary" (click)="updateDeadline()">บันทึกการเปลี่ยนแปลง</button>
      </div>
    </div>
  </div>
</div>
