<h2>ตารางสั่งงานตัวอย่าง</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden" >
    <div class="card-body bg-light">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="row g-3">
          
          <div class="col-md-3">
            <label class="form-label fw-bold">ID</label>
            <input type="text" class="form-control" formControlName="id" placeholder="ระบุ ID">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ชื่อโฟลเดอร์งาน</label>
            <input type="text" class="form-control" formControlName="folderName" placeholder="ระบุชื่อโฟลเดอร์">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">เจ้าของงาน</label>
            <input type="text" class="form-control" formControlName="jobOwner" placeholder="ระบุเจ้าของงาน">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ผู้รับผิดชอบ</label>
            <input type="text" class="form-control" formControlName="responsiblePerson" placeholder="ระบุผู้รับผิดชอบ">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">สถานะ</label>
            <select class="form-select" formControlName="status">
              <option value="">ทั้งหมด</option>
              <option value="ไฟล์เสร็จ รอตรวจสอบไฟล์">ไฟล์เสร็จ รอตรวจสอบไฟล์</option>
              <option value="แก้ไขไฟล์">แก้ไขไฟล์</option>
              <option value="ไฟล์ถูกต้อง">ไฟล์ถูกต้อง</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ตั้งแต่วันที่</label>
            <input type="date" class="form-control" formControlName="startDate" (change)="onStartDateChange()">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ถึงวันที่</label>
            <input type="date" class="form-control" formControlName="endDate" [min]="minEndDate | date:'yyyy-MM-dd'">
          </div>

          <div class="col-12">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button color="primary" type="submit" class="w-100 px-3" style="background-color: #2e2200;">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button color="warn" type="button" class="w-100 px-3" (click)="onClear()" style="color: #2e2200;">
                  <mat-icon>refresh</mat-icon> ล้างค่า
                </button>
              </div>
              <div class="col-12 col-sm-12 col-md-4 col-lg-auto">
                <button mat-flat-button color="accent" class="w-100 px-3 position-relative" (click)="onFilterUnassigned()" style="background-color: #2e2200;">
                  <mat-icon>search</mat-icon> <span class="d-none d-lg-inline">งานที่รอตรวจสอบ</span>
                  <span *ngIf="inspection > 0"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                    style="font-size: 0.75rem; border: 2px solid #fff;">
                    {{ inspection }}
                    <span class="visually-hidden">unread messages</span>
                  </span>
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button type="button" mat-flat-button class="w-100 px-3" (click)="sortByClosestDate()"
                  style="background: #2e2200; color: white; font-family: 'Prompt', sans-serif;">
                  <mat-icon>sort</mat-icon> <span class="d-none d-lg-inline">เรียงตามงานที่ไกล้ส่ง</span><span
                    class="d-lg-none">เรียงตามวันส่ง</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table 
    [headerStyle]="'background: #2e2200; color: #ffffff;'"
    [columns]="tableColumns" 
    [data]="tableData" 
    [totalElements]="totalElements" 
    [pageSize]="pageSize"
    [pageIndex]="pageIndex" 
    [clickableColumn]="'id'" 
    (pageChange)="onPageChange($event)"
    (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
