<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="confirm == true" type="submit" (click)="updateStatusComplete()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            ยืนยันรับงาน
          </button>

          <!-- หลังรับงานแล้ว (รอดำเนินการ) ให้เลือก งานภายใน / ส่ง Supplier -->
          <button *ngIf="internalJob == true" type="button" (click)="updateStatusInternalJob()"
            class="btn text-white px-4 shadow-sm" style="background-color: #0d9488;">
            งานภายใน
          </button>
          <button *ngIf="sendSupplier == true" type="button" (click)="updateStatusSendSupplier()"
            class="btn text-white px-4 shadow-sm" style="background-color: #ea580c;">
            ส่ง Supplier
          </button>

          <button *ngIf="confirmDeliver == true" type="submit" (click)="updateStatusDeliver()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            จัดส่งได้
          </button>
          <button *ngIf="notDeliver == true" type="button" (click)="openNotDeliverModal()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            จัดส่งไม่ได้
          </button>

          <!-- เมื่อสถานะเป็น ส่งSupplier ให้มีปุ่มรับกลับ -->
          <button *ngIf="receiveBack == true" type="button" (click)="updateStatusReceiveBack()"
            class="btn text-white px-4 shadow-sm" style="background-color: #2563eb;">
            รับกลับ
          </button>

          <button *ngIf="clearFile == true" type="submit" (click)="updateStatusClearFile()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            เริ่มเคลียร์ไฟล์
          </button>
          <button *ngIf="inspection == true" type="submit" (click)="updateStatusInspection()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            ส่งตรวจ
          </button>
          <button *ngIf="samples == true" type="submit" (click)="updateStatusSamples()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            ส่งขึ้นตัวอย่าง
          </button>
          <button *ngIf="deadline == true" type="submit" (click)="updateStatusSucsess()"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            กำหนดส่งกลับ
          </button>
          <button *ngIf="inFileProof == true" type="submit" (click)="proofStatusClearFile()"
            class="btn text-white px-5 shadow-sm" style="background-color: #d000ff;">
            เริ่มทำไฟล์Proof
          </button>
          <button *ngIf="checkFileProof == true" type="submit" (click)="proofStatusFileComplet()"
            class="btn text-white px-5 shadow-sm" style="background-color: #d000ff;">
            ส่งตรวจไฟล์Proof
          </button>
          <button *ngIf="sendFileProof == true" type="submit" (click)="proofStatusSend()"
            class="btn text-white px-5 shadow-sm" style="background-color: #d000ff;">
            ส่งProofหน้าแท่น
          </button>


        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="id" class="form-control">
        </div>
        <div *ngIf="isDesign" class="col-md-6">
          <label class="form-label font-weight-bold">อ้างอิงตารางสั่งออกแบบ</label>
          <input type="text" formControlName="designOrderId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">JobId</label>
          <input type="text" formControlName="jobId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">QtId</label>
          <input type="text" formControlName="qtId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">QPId</label>
          <input type="text" formControlName="qpId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="date" formControlName="orderDate" class="form-control"
            [class.is-invalid]="mainForm.get('order_date')?.invalid && mainForm.get('order_date')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เวลาสั่งงาน</label>
          <input type="time" formControlName="orderTime" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน</label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="mainForm.get('folder_name')?.invalid && mainForm.get('folder_name')?.touched"
            style="background-color: #ffee00; color: #000000;">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ (Assignee)</label>
          <input type="text" formControlName="responsiblePerson" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ต้องส่ง</label>
          <input type="date" formControlName="deliveryDate" class="form-control"
            style="background-color: #ffee00; color: #000000;">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาที่ต้องส่ง</label>
          <input type="time" formControlName="deliveryTime" class="form-control"
            style="background-color: #ffee00; color: #000000;">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">สถานะ</label>
          <input type="text" formControlName="status" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">จำนวน</label>
          <input type="number" formControlName="quantity" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">หน่วยนับ</label>
          <input type="text" formControlName="unit" class="form-control">
        </div>
        <div class="col-md-2" *ngIf="mainForm.get('totalPrintSheets')?.value">
          <label class="form-label font-weight-bold">จำนวนใบพิมพ์</label>
          <input type="number" formControlName="totalPrintSheets" class="form-control">
        </div>
        <div class="col-md-5">
          <label class="form-label font-weight-bold">ชื่อลูกค้า</label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า">
        </div>
        <div class="col-md-5">
          <label class="form-label font-weight-bold">ชื่อไฟล์ล่าสุด</label>
          <input style="background-color: rgb(255, 136, 1); color: white;" type="text" formControlName="fileName"
            class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <input type="text" formControlName="note" class="form-control" placeholder="หมายเหตุเพิ่มเติม">
        </div>
        <div class="col-12" *ngIf="isNoteEdit == true">
          <label class="form-label font-weight-bold">รายละเอียดแก้ไข</label>
          <input style="background-color: rgb(255, 136, 1); color: white;" type="text" formControlName="noteEdit"
            class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เครื่องพิมพ์</label>
          <div class="form-check form-switch mt-2"> <input type="checkbox" formControlName="machineName"
              class="form-check-input" id="machineNameSwitch">
            <label class="form-check-label" for="machineNameSwitch">Bluesky</label>
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-check form-switch mt-2"> <input type="checkbox" formControlName="isCreateSample"
              class="form-check-input" id="isCreateSampleSwitch">
            <label class="form-check-label" for="isCreateSampleSwitch">ขึ้นตัวอย่าง</label>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="card-body">
  <div class="card total-income-card info overflow-hidden">
    <div style="padding: 10px;">
      <h5 class="card-title mb-3">รายละเอียดงานพิมพ์</h5>
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ประเภทงาน</label>
          <input type="text" formControlName="jobType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ระบบพิมพ์</label>
          <input type="text" formControlName="systemPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานพิมพ์</label>
          <input type="text" formControlName="printType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">สีที่พิมพ์</label>
          <input type="text" formControlName="colorPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ขนาดกระดาษ</label>
          <input type="text" formControlName="paperType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">แกรมกระดาษ</label>
          <input type="text" formControlName="paperGram" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานเคลือบ</label>
          <input type="text" formControlName="coatType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานไดคัท</label>
          <input type="text" formControlName="diecuttingType" class="form-control">
        </div>
      </form>
      <br>
    </div>
  </div><br>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showNotDeliverModal"
  style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">ระบุเวลาที่จัดส่งได้</h5>
        <button type="button" class="btn-close" (click)="closeNotDeliverModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="failTime" class="form-label">วันที่<span style="color: red;">*</span></label>
          <input type="date" class="form-control" [formControl]="notDeliverDate">
        </div>
        <div class="mb-3">
          <label for="failTime" class="form-label">เวลา<span style="color: red;">*</span></label>
          <input type="time" class="form-control" [formControl]="notDeliverTime">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeNotDeliverModal()">ยกเลิก</button>
        <button type="button" class="btn btn-primary" (click)="confirmNotDeliver()"
          style="background-color: #1e1b4b;">ยืนยัน</button>
      </div>
    </div>
  </div>
</div>
