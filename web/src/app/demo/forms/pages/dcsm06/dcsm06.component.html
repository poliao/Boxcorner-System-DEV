<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="font-weight-bold text-dark m-0">ตารางคอนเฟิร์มรอผลิต</h2>
    <button mat-flat-button style="background-color: #00e5ff; color: white;" (click)="add()">
      <mat-icon>add</mat-icon> เพิ่มรายการ
    </button>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body bg-light rounded">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="row g-3">

          <div class="col-md-3">
            <label class="form-label fw-bold">รหัสสั่งผลิต (ID)</label>
            <input type="number" class="form-control" formControlName="id" placeholder="ระบุ ID">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ชื่อโฟลเดอร์งาน</label>
            <input type="text" class="form-control" formControlName="folderName" placeholder="ระบุชื่อโฟลเดอร์">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ประเภทงาน</label>
            <input type="text" class="form-control" formControlName="jobType" placeholder="เช่น กล่องฝาชน">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">เจ้าของงาน</label>
            <input type="text" class="form-control" formControlName="jobOwner" placeholder="ระบุเจ้าของงาน">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ผู้รับผิดชอบ</label>
            <input type="text" class="form-control" formControlName="responsiblePerson" placeholder="ระบุผู้รับผิดชอบ">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">สถานะงาน (Job Status)</label>
            <select class="form-select" formControlName="status">
              <option value="">ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน	</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">สถานะดำเนินการ (Process)</label>
            <select class="form-select" formControlName="processStatus">
              <option value="">ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน	</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
              <option value="เสร็จสิ้น รอตรวจสอบ">เสร็จสิ้น รอตรวจสอบ</option>
              <option value="ตรวจไฟล์แม่พิมพ์แล้ว">ตรวจไฟล์แม่พิมพ์แล้ว</option>
              <option value="ตรวจใบสั่งผลิตแล้ว">ตรวจใบสั่งผลิตแล้ว</option>
              <option value="ส่งใบสั่งผลิตแล้ว">ส่งใบสั่งผลิตแล้ว</option>
              <option value="ส่งไฟล์แล้ว">ส่งไฟล์แล้ว</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">สถานะแม่พิมพ์ (Mold)</label>
            <select class="form-select" formControlName="moldStatus">
              <option value="">ทั้งหมด</option>
              <option value="รอผู้รับผิดชอบยืนยัน	">รอผู้รับผิดชอบยืนยัน	</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังทำแม่พิมพ์">กำลังทำแม่พิมพ์</option>
              <option value="แม่พิมพ์เสร็จแล้ว">แม่พิมพ์เสร็จแล้ว</option>
              <option value="ส่งแม่พิมพ์">ส่งแม่พิมพ์</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ตั้งแต่วันที่</label>
            <input type="date" class="form-control" formControlName="startDate" (change)="onStartDateChange()">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold">ถึงวันที่</label>
            <input type="date" class="form-control" formControlName="endDate" [min]="minEndDate | date:'yyyy-MM-dd'">
          </div>

          <div class="col-md-6 d-flex align-items-end justify-content-end gap-2">
            <button type="button" class="btn text-white px-4" (click)="onClear()" style="background-color: #63d5e2;">
              <i class="fa fa-refresh me-1"></i> ล้างค่า
            </button>
            <button type="submit" class="btn text-white px-4" style="background-color: #1bd0e4;">
              <i class="fa fa-search me-1"></i> ค้นหา
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #69e2f0; color: #000000;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
