<div class="row align-items-center mb-4 g-3">
  <div class="col-12 col-md-6">
    <h4 class="mb-0 fw-bold" style="color: #003747;">DCSM41 - รายงานสินค้าคงคลัง (Inventory)</h4>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <app-data-table 
      [columns]="tableColumns" 
      [data]="tableData"
      [totalElements]="totalElements" 
      [pageSize]="pageSize" 
      [pageIndex]="pageIndex" 
      (pageChange)="onPageChange($event)"
      [clickableColumn]="'materialId'"
      (rowClick)="onRowClick($event)">
    </app-data-table>
  </div>
</div>
