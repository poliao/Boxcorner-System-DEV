<div class="container-fluid py-3">
  <div class="card shadow-sm">
    <div class="card-body">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
          <mat-icon style="vertical-align:middle;">inventory_2</mat-icon>
          {{ isNew ? 'เพิ่มรายการสต็อก' : 'แก้ไขรายการสต็อก' }}
        </h5>
        <button class="btn btn-outline-secondary btn-sm" (click)="back()">
          <mat-icon style="vertical-align:middle;font-size:18px;">arrow_back</mat-icon> กลับ
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="row g-3">

          <!-- ชื่อสินค้า -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">ชื่อสินค้า <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="itemName" placeholder="เช่น กระดาษอาร์ต 128 แกรม">
            <div *ngIf="form.get('itemName')?.invalid && form.get('itemName')?.touched" class="text-danger small mt-1">
              กรุณากรอกชื่อสินค้า
            </div>
          </div>

          <!-- ประเภท -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">ประเภท</label>
            <input type="text" class="form-control" formControlName="category" placeholder="เช่น กระดาษ, ฟิล์ม">
          </div>

          <!-- ขนาด -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">ขนาด</label>
            <input type="text" class="form-control" formControlName="paperSize" placeholder="เช่น A4, 65x100">
          </div>

          <div class="col-12">
            <hr class="my-1">
          </div>

          <!-- ยอดหลัก -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">ยอดหลัก</label>
            <input type="number" class="form-control" formControlName="majorQuantity" min="0" step="0.01">
          </div>

          <!-- หน่วยหลัก -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">หน่วยหลัก</label>
            <input type="text" class="form-control" formControlName="majorUnit" placeholder="เช่น รีม, กล่อง">
          </div>

          <!-- ยอดรอง -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">ยอดรอง</label>
            <input type="number" class="form-control" formControlName="minorQuantity" min="0" step="0.01">
          </div>

          <!-- หน่วยรอง -->
          <div class="col-md-3">
            <label class="form-label fw-semibold">หน่วยรอง</label>
            <input type="text" class="form-control" formControlName="minorUnit" placeholder="เช่น แผ่น, ชิ้น">
          </div>

        </div>

        <!-- Actions -->
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary px-4">
            <mat-icon style="vertical-align:middle;font-size:18px;">save</mat-icon> บันทึก
          </button>
          <button type="button" class="btn btn-outline-secondary px-4" (click)="back()">ยกเลิก</button>
        </div>
      </form>

    </div>
  </div>
</div>
