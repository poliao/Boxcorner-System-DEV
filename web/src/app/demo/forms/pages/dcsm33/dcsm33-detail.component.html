<div class="row align-items-center mb-3">
  <div class="col">
    <h2 class="h5 mb-0 text-gray-800 fw-bold d-flex align-items-center">
      <mat-icon class="me-2 text-primary">assignment</mat-icon>
      ข้อมูลงานเคลือบ (အလုပ်အချက်အလက်)
    </h2>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <div class="card shadow-sm border-0 rounded-3 mb-4">
      <div
        class="card-header bg-white border-bottom py-3 px-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="fw-bold text-primary">รายละเอียดงาน (လုပ်ငန်းတာဝန်သတ်မှတ်ချက်)</span>
        <button type="button" class="btn btn-warning text-dark fw-bold px-4 py-2"
          style="min-width: 140px; font-size: 1rem;" *ngIf="isEditMode" (click)="openStartCoatingModal()">
          <mat-icon class="align-middle me-1">document_scanner</mat-icon> เริ่มเคลือบ (စတင်ပါ။)
        </button>
      </div>
      <div class="card-body p-3 p-md-4">
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">JO</label>
              <input type="text" class="form-control form-control-lg" formControlName="joId" readonly>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">ชื่อลูกค้า / ชื่องาน (ဖောက်သည်အမည် / အလုပ်)</label>
              <input type="text" class="form-control form-control-lg" formControlName="jobCustomerName" readonly>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">เจ้าของงาน (ပိုင်ရှင်)</label>
              <input type="text" class="form-control form-control-lg" formControlName="jobOwnerName">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">ยอดผลิต/กล่อง (တစ်ယူနစ်စုစုပေါင်းထုတ်လုပ်မှု)</label>
              <input type="number" class="form-control form-control-lg" formControlName="requiredSheetsQty">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">ยอดใบพิมพ์ (လက်ခဲ့လုပြေး)</label>
              <input type="number" class="form-control form-control-lg" formControlName="receivedSheetsQty">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold mb-1">กำหนดส่งงาน (ပေးပို့ရန် နောက်ဆုံးရက်)</label>
              <input type="datetime-local" class="form-control form-control-lg" formControlName="deliveryDatetime">
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div *ngIf="showStartCoatingModal"
  style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1050;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;">
  <div class="card border-0 shadow-lg w-100"
    style="max-width:520px;border-radius:1rem;max-height:calc(100dvh - 16px);max-height:calc(100vh - 16px);display:flex;flex-direction:column;">
    <div class="card-header d-flex justify-content-between align-items-center py-3 px-4"
      style="background:linear-gradient(135deg,#f6921e,#f4b942);border-radius:1rem 1rem 0 0;">
      <div class="d-flex align-items-center gap-2">
        <mat-icon style="color:#fff;">document_scanner</mat-icon>
        <span class="fw-bold text-white" style="font-size:1.05rem;">ข้อมูลการเคลือบ (ဆေးကပ်ခြင်း)</span>
      </div>
      <button class="btn btn-sm btn-light rounded-circle d-flex align-items-center justify-content-center"
        style="width:36px;height:36px;" (click)="closeStartCoatingModal()">
        <mat-icon style="font-size:1.1rem;line-height:1;">close</mat-icon>
      </button>
    </div>
    <div class="card-body p-2 p-md-3" style="overflow-y:auto;">
      <form [formGroup]="startCoatingForm">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">
              🌡️ อุณหภูมิที่ใช้เคลือบ (ကပ်ဆေးအပူချိန်) (°C)
              <span style="color: red;">*</span>
            </label>
            <input type="number" inputmode="decimal" class="form-control form-control-lg"
              formControlName="laminatingTemp" placeholder="เช่น 75"
              [class.is-invalid]="startCoatingForm.get('laminatingTemp')?.invalid && startCoatingForm.get('laminatingTemp')?.touched">
            <div class="invalid-feedback">กรุณากรอกอุณหภูมิ (အပူချိန် ဖြည့်ပေးပါ)</div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold d-block mb-1" style="font-size:0.9rem;">
              ✨ ประเภทการเคลือบ (ဆေးကပ်အမျိုးအစား) <span style="color: red;">*</span>
            </label>
            <div class="d-flex gap-2">
              <label class="flex-fill text-center border rounded-3 py-2 cursor-pointer"
                [style.border-color]="startCoatingForm.get('coatingType')?.value === 'เงา' ? '#f6921e' : '#dee2e6'"
                [style.background]="startCoatingForm.get('coatingType')?.value === 'เงา' ? '#fff8f0' : '#fff'"
                style="cursor:pointer;transition:all 0.2s;">
                <input type="radio" formControlName="coatingType" value="เงา" class="d-none" id="coatGloss">
                <div style="font-size:1.2rem;">✨</div>
                <div class="fw-bold" style="font-size:0.85rem;">เงา (ကြည်) Gloss</div>
              </label>
              <label class="flex-fill text-center border rounded-3 py-2 cursor-pointer"
                [style.border-color]="startCoatingForm.get('coatingType')?.value === 'ด้าน' ? '#6c757d' : '#dee2e6'"
                [style.background]="startCoatingForm.get('coatingType')?.value === 'ด้าน' ? '#f8f9fa' : '#fff'"
                style="cursor:pointer;transition:all 0.2s;">
                <input type="radio" formControlName="coatingType" value="ด้าน" class="d-none" id="coatMatte">
                <div style="font-size:1.2rem;">🌫️</div>
                <div class="fw-bold" style="font-size:0.85rem;">ด้าน (မကြည်) Matte</div>
              </label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">
              🎞️ เลือกฟิล์มจากสต็อค (ဖလင်ရွေးပါ)
              <span style="color: red;">*</span>
            </label>
            <button type="button"
              class="form-control form-control-lg text-start d-flex justify-content-between align-items-center"
              [style.border-color]="startCoatingForm.get('filmStockId')?.invalid && startCoatingForm.get('filmStockId')?.touched ? '#dc3545' : ''"
              (click)="showFilmDropdown = !showFilmDropdown">
              <span [class.text-muted]="!selectedFilm">
                {{ selectedFilm ? selectedFilm.itemName : '-- เลือกฟิล์ม --' }}
              </span>
              <mat-icon style="font-size:1.1rem;opacity:0.6;">{{ showFilmDropdown ? 'expand_less' : 'expand_more'
                }}</mat-icon>
            </button>
            <div *ngIf="showFilmDropdown" class="border rounded-3 mt-1 bg-white shadow-sm"
              style="max-height:200px;overflow-y:auto;">
              <div *ngIf="filmStockList.length === 0" class="p-3 text-muted text-center small">
                ⚠️ ไม่พบฟิล์มที่มีสต็อคคงเหลือ
              </div>
              <button type="button" *ngFor="let film of filmStockList"
                class="d-block w-100 text-start border-0 bg-transparent px-3 py-2"
                [style.background]="selectedFilm?.id === film.id ? '#fff8f0' : ''"
                [style.font-weight]="selectedFilm?.id === film.id ? 'bold' : 'normal'"
                style="border-bottom:1px solid #f0f0f0;" (click)="selectFilm(film)">
                {{ film.itemName }}
              </button>
            </div>
            <div class="text-danger small mt-1"
              *ngIf="startCoatingForm.get('filmStockId')?.invalid && startCoatingForm.get('filmStockId')?.touched">
              กรุณาเลือกฟิล์ม
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">
              📏 ขนาดความยาวของกระดาษ (စက္ကူအရှည်) (cm)
              <span style="color: red;">*</span>
            </label>
            <input type="number" inputmode="decimal" class="form-control form-control-lg" formControlName="paperLength"
              placeholder="เช่น 52.5" step="0.01"
              [class.is-invalid]="startCoatingForm.get('paperLength')?.invalid && startCoatingForm.get('paperLength')?.touched">
            <div class="invalid-feedback">กรุณากรอกขนาดความยาวกระดาษ</div>
          </div>
        </div>
      </form>
    </div>
    <div class="card-footer px-3 py-3 d-flex flex-column flex-sm-row gap-2" style="border-radius:0 0 1rem 1rem;">
      <button class="btn btn-outline-secondary btn-lg flex-fill order-2 order-sm-1" (click)="closeStartCoatingModal()">
        <mat-icon class="align-middle me-1">close</mat-icon>ยกเลิก (ပယ်ဖျက်)
      </button>
      <button class="btn btn-warning text-dark fw-bold btn-lg flex-fill order-1 order-sm-2"
        (click)="confirmStartCoating()" [disabled]="startCoatingForm.invalid">
        <mat-icon class="align-middle me-1">check_circle</mat-icon>ยืนยันเริ่มเคลือบ (အတည်ပြု)
      </button>
    </div>
  </div>
</div>
