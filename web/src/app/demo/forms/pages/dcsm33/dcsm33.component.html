<h2>บันทึกเคลือบ (DCSM-33)</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <form>
        <div class="row g-3">
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="ค้นหา JO Number" [(ngModel)]="searchParams.joId"
              name="joId" (keyup.enter)="onSearch()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="ชื่องาน/ลูกค้า"
              [(ngModel)]="searchParams.jobCustomerName" name="jobCustomerName" (keyup.enter)="onSearch()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="ช่างเคลือบ" [(ngModel)]="searchParams.technicianName"
              name="technicianName" (keyup.enter)="onSearch()">
          </div>

          <div class="col-12">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button color="primary" type="button" class="w-100 px-3" (click)="onSearch()"
                  style="background-color: #350142;">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button color="warn" type="button" class="w-100 px-3" (click)="onClearSearch()">
                  <mat-icon>clear</mat-icon> ล้างค่า
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #350142; color: #ffffff;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
