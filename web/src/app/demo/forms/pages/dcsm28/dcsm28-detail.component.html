<div class="card">
  <div class="card-header">
    <div class="row align-items-center">
      <div class="col-12 col-md-6">
        <h1 class="mb-2 mb-md-0">การขาย</h1>
      </div>
      <div class="col-12 col-md-6">
        <div class="d-grid d-md-flex justify-content-md-end gap-2">
          <button mat-flat-button *ngIf="isEditMode && !hasQuotation" (click)="addQuotation()" style="background-color: #ff4800; color: white;">
            <mat-icon>add</mat-icon> เพิ่มใบเสนอราคา
          </button>
          <button mat-flat-button *ngIf="isEditMode && hasQuotation" (click)="editQuotation()" style="background-color: #ff9800; color: white;">
            <mat-icon>edit</mat-icon> แก้ไขใบเสนอราคา
          </button>
          <button mat-flat-button (click)="onSave()" style="background-color: #1e1b4b; color: white;">
            <mat-icon>save</mat-icon> บันทึก
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <form [formGroup]="activityForm">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="activityId" class="form-control" >
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันที่ </label>
          <input type="date" formControlName="activityDate" class="form-control"
            [class.is-invalid]="activityForm.get('activityDate')?.invalid && activityForm.get('activityDate')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ชื่อพนักงานขาย </label>
          <input type="text" formControlName="salesName" class="form-control" >
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">ชื่อบริษัท <span style="color: red;">*</span></label>
          <input type="text" formControlName="companyName" class="form-control" placeholder="ชื่อบริษัท"
            [class.is-invalid]="activityForm.get('companyName')?.invalid && activityForm.get('companyName')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ชื่อลูกค้า <span style="color: red;">*</span></label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า"
            [class.is-invalid]="activityForm.get('customerName')?.invalid && activityForm.get('customerName')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ผู้ติดต่อ <span style="color: red;">*</span></label>
          <input type="text" formControlName="contactPerson" class="form-control" placeholder="ชื่อผู้ติดต่อ"
          [class.is-invalid]="activityForm.get('contactPerson')?.invalid && activityForm.get('contactPerson')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เบอร์โทร/ช่องทางติดต่อ<span style="color: red;">*</span></label>
          <input type="text" formControlName="contact" class="form-control" placeholder="เบอร์โทร/ช่องทางติดต่อ"
          [class.is-invalid]="activityForm.get('contact')?.invalid && activityForm.get('contact')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">จังหวัด<span style="color: red;">*</span></label>
          <div class="position-relative">
            <input type="text" 
                   formControlName="province" 
                   class="form-control" 
                   placeholder="เลือกหรือพิมพ์ค้นหาจังหวัด"
                   (input)="onProvinceSearch($event)"
                   (focus)="onProvinceSearch($event)"
                   (blur)="onProvinceBlur()"
                   (keydown)="onProvinceKeydown($event)"
                   autocomplete="off"
                   [class.is-invalid]="activityForm.get('province')?.invalid && activityForm.get('province')?.touched">
            <ul class="list-group position-absolute w-100" 
                style="z-index: 1000; max-height: 250px; overflow-y: auto;"
                *ngIf="filteredProvinces.length > 0">
              <li class="list-group-item list-group-item-action" 
                  style="cursor: pointer;"
                  *ngFor="let province of filteredProvinces; let i = index" 
                  [class.active]="i === selectedProvinceIndex"
                  (mousedown)="selectProvince(province)">
                {{ province.nameTh }} ({{ province.nameEn }})
              </li>
            </ul>
          </div>
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ช่องทางพบ <span style="color: red;">*</span></label>
          <select formControlName="contactChannel" class="form-select" [class.is-invalid]="activityForm.get('contactChannel')?.invalid && activityForm.get('contactChannel')?.touched">
            <option value="">เลือกช่องทาง</option>
            <option value="MsTeam">MsTeam</option>
            <option value="ZOOM">ZOOM</option>
            <option value="อีเมล">อีเมล</option>
            <option value="โทร">โทร</option>
            <option value="พบหน้างาน">พบหน้างาน</option>
            <option value="Line">Line</option>
            <option value="Facebook">Facebook</option>
            <option value="Instagram">Instagram</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">สถานะ <span style="color: red;">*</span></label>
          <select formControlName="activitiesStatus" class="form-select" [class.is-invalid]="activityForm.get('activitiesStatus')?.invalid && activityForm.get('activitiesStatus')?.touched">
            <option value="ติดต่อ">ติดต่อ</option>
            <option value="เข้าพบลูกค้า">เข้าพบลูกค้า</option>
            <option value="เก็บความต้องการลูกค้า">เก็บความต้องการลูกค้า</option>
            <option value="เสนอราคา">เสนอราคา</option>
            <option value="เจรจาต่อรอง">เจรจาต่อรอง</option>
            <option value="รอลูกค้าอนุมัติ">รอลูกค้าอนุมัติ</option>
            <option value="ได้งาน">ได้งาน</option>
            <option value="ไม่ได้งาน">ไม่ได้งาน</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">% ที่คิดว่าจะได้งาน <span style="color: red;">*</span></label>
          <input type="number" formControlName="probability" class="form-control" placeholder="0-100" min="0" max="100" [class.is-invalid]="activityForm.get('probability')?.invalid && activityForm.get('probability')?.touched">
        </div>
        <div class="col-md-2" *ngIf="activityForm.get('activitiesStatus')?.value === 'ไม่ได้งาน'">
          <label class="form-label font-weight-bold">เหตุผลที่ไม่ได้งาน <span style="color: red;">*</span></label>
          <select formControlName="lostReason" class="form-select" [class.is-invalid]="activityForm.get('lostReason')?.invalid && activityForm.get('lostReason')?.touched">
            <option value="">เลือกเหตุผล</option>
            <option value="ราคาสูงกว่าคู่แข่ง">ราคาสูงกว่าคู่แข่ง</option>
            <option value="ลูกค้ามีงบประมาณจำกัด">ลูกค้ามีงบประมาณจำกัด</option>
            <option value="จำนวนสั่งผลิตน้อยกว่าขั้นต่ำ">จำนวนสั่งผลิตน้อยกว่าขั้นต่ำ</option>
            <option value="สเปคงาน/เทคนิคพิเศษ ไม่สามารถผลิตได้">สเปคงาน/เทคนิคพิเศษ ไม่สามารถผลิตได้</option>
            <option value="ระยะเวลาผลิตนานเกินไป">ระยะเวลาผลิตนานเกินไป</option>
            <option value="ติดต่อลูกค้าไม่ได้">ติดต่อลูกค้าไม่ได้</option>
            <option value="ลูกค้าเลือกคู่ค้าเดิม">ลูกค้าเลือกคู่ค้าเดิม</option>
            <option value="ลูกค้ายกเลิกโปรเจกต์">ลูกค้ายกเลิกโปรเจกต์</option>
            <option value="ลูกค้าตัดสินใจใช้ Supplier เจ้าเดิม">ลูกค้าตัดสินใจใช้ Supplier เจ้าเดิม</option>
            <option value="ผู้มีอำนาจตัดสินใจไม่อนุมัติ">ผู้มีอำนาจตัดสินใจไม่อนุมัติ</option>
            <option value="ตกลงเงื่อนไขการชำระเงินไม่ได้">ตกลงเงื่อนไขการชำระเงินไม่ได้</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">นัดครั้งถัดไป</label>
          <input formControlName="nextStep" class="form-control" rows="3" placeholder="นัดครั้งถัดไป">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันที่นัดครั้งถัดไป</label>
          <input type="date" formControlName="nextDate" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เวลานัดครั้งถัดไป</label>
          <input type="time" formControlName="nextTime" class="form-control">
        </div>
         <div class="col-md-12">
          <div class="form-check">
            <input type="checkbox" formControlName="isNewCustomer" class="form-check-input" id="isNewCustomer" >
            <label class="form-check-label font-weight-bold" for="isNewCustomer" >
             ลูกค้าใหม่
            </label>
          </div>
        </div>
        <div class="col-md-12">
          <label class="form-label font-weight-bold">วัตถุประสงค์ <span style="color: red;">*</span></label>
          <textarea formControlName="objective" class="form-control" rows="3" placeholder="วัตถุประสงค์ของการติดต่อ" [class.is-invalid]="activityForm.get('objective')?.invalid && activityForm.get('objective')?.touched"></textarea>
        </div>
        <div class="col-md-12">
          <label class="form-label font-weight-bold">ผลการพูดคุย <span style="color: red;">*</span></label>
          <textarea formControlName="discussionResult" class="form-control" rows="3" placeholder="สรุปผลการพูดคุย" [class.is-invalid]="activityForm.get('discussionResult')?.invalid && activityForm.get('discussionResult')?.touched"></textarea>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Quotation Modal -->
<div class="modal fade show d-block" tabindex="-1" *ngIf="showQuotationModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ hasQuotation ? 'แก้ไขใบเสนอราคา' : 'เพิ่มใบเสนอราคา' }}</h5>
        <button type="button" class="btn-close" (click)="closeQuotationModal()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="quotationForm">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label font-weight-bold">เลขที่ใบเสนอราคา <span style="color: red;">*</span></label>
              <input type="text" formControlName="quoteNumber" class="form-control" placeholder="QT-69001"
                [class.is-invalid]="quotationForm.get('quoteNumber')?.invalid && quotationForm.get('quoteNumber')?.touched">
            </div>
            <div class="col-md-12">
              <label class="form-label font-weight-bold">ยอดขาย (บาท) <span style="color: red;">*</span></label>
              <input type="number" formControlName="amount" class="form-control" placeholder="0.00" step="0.01"
                [class.is-invalid]="quotationForm.get('amount')?.invalid && quotationForm.get('amount')?.touched">
            </div>
            <div class="col-12">
              <label class="form-label font-weight-bold">สถานะ <span style="color: red;">*</span></label>
              <select formControlName="status" class="form-select"
                [class.is-invalid]="quotationForm.get('status')?.invalid && quotationForm.get('status')?.touched">
                <option value="">เลือกสถานะ</option>
                <option value="นำเสนอลูกค้า">นำเสนอลูกค้า</option>
                <option value="ลูกค้าต่อรอง">ลูกค้าต่อรอง</option>
                <option value="ยกเลิก">ยกเลิก</option>
                <option value="ลูกค้าตกลง(รอขึ้นตัวอย่าง)">ลูกค้าตกลง(รอขึ้นตัวอย่าง)</option>
                <option value="ลูกค้าปฏิเสธ">ลูกค้าปฏิเสธ</option>
                <option value="ยืนยันเปิดใบผลิต">ยืนยันเปิดใบผลิต</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label font-weight-bold">หมวดหมู่สินค้า <span style="color: red;">*</span></label>
              <select formControlName="productCategory" class="form-select"
                [class.is-invalid]="quotationForm.get('productCategory')?.invalid && quotationForm.get('productCategory')?.touched">
                <option value="">เลือกหมวดหมู่</option>
                <option value="กล่อง">กล่อง</option>
                <option value="นามบัตร">นามบัตร</option>
                <option value="แผ่นพับ">แผ่นพับ</option>
                <option value="สติ๊กเกอร์">สติ๊กเกอร์</option>
                <option value="หนังสือ">หนังสือ</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label font-weight-bold">หมายเหตุ</label>
              <textarea formControlName="remark" class="form-control" rows="3" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <div class="row w-100 g-2">
          <div class="col-12 col-md-6">
            <button type="button" class="btn btn-secondary w-100" (click)="closeQuotationModal()">ยกเลิก</button>
          </div>
          <div class="col-12 col-md-6">
            <button type="button" class="btn btn-success w-100" (click)="saveQuotation()">บันทึก</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
