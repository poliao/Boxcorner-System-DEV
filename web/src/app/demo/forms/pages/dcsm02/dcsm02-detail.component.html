<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="designForm" class="row g-3">
        <div class="col-12 d-flex  gap-2 mt-4">
          <button *ngIf="isBtnApprove == true" (click)="openApproveModal()" class="btn text-white px-5 shadow-sm"
            style="background-color: #16bd2c;">
            อนุมัติ
          </button>
          <button *ngIf="isBtnApprove == true" (click)="openEditModal()" class="btn text-white px-5 shadow-sm"
            style="background-color: #b61a1a;">
            แก้ไข
          </button>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="isBtnSave == true" (click)="onSubmit()" type="submit" class="btn text-white px-5 shadow-sm"
            [disabled]="designForm.invalid" style="background-color: #1e1b4b;">
            {{ isEditMode ? 'อัปเดตข้อมูล' : 'บันทึกข้อมูล' }}
          </button>

        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="id" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน<span style="color: red;">*</span></label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="designForm.get('folder_name')?.invalid && designForm.get('folder_name')?.touched">
        </div>

        <div class="col-md-4">
          <label class="form-label font-weight-bold">รายละเอียดงาน<span style="color: red;">*</span></label>
          <input type="text" formControlName="jobDetails" class="form-control" placeholder="ระบุรายละเอียดงาน">
        </div>

        <div class="col-12">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <input type="text" formControlName="remarks" class="form-control" placeholder="หมายเหตุเพิ่มเติม">
        </div>

        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันส่ง<span style="color: red;">*</span></label>
          <input type="text" #deadlineDateInput class="form-control" 
            (input)="onThaiDateInput($event, 'deadlineDate')" 
            [value]="getThaiDateInput('deadlineDate')"
            [disabled]="designForm.get('deadlineDate')?.disabled"
            placeholder="วว/ดด/ปป (13/01/26)" maxlength="8">
        </div>

        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาส่ง<span style="color: red;">*</span></label>
          <input type="time" formControlName="deadlineTime" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ</label>
          <input type="text" formControlName="assignee" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">สถานะดำเนินการ</label>
          <input type="text" formControlName="processStatus" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">สถานะคอนเฟิร์ม</label>
          <input type="text" formControlName="confirmStatus" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="text" class="form-control" [value]="getThaiDateInput('orderDate')" readonly disabled
            [class.is-invalid]="designForm.get('orderDate')?.invalid && designForm.get('orderDate')?.touched">
        </div>

        <div class="col-md-4" *ngIf="isFileName">
          <label class="form-label font-weight-bold">ชื่อไฟล์ล่าสุด</label>
          <input type="text" formControlName="fileName" class="form-control" style="background-color: #ff7b00; color: white;">
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showApproveModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">อนุมัติข้อมูลไปยัง ตารางสั่งงานตัวอย่าง</h5>
        <button type="button" class="btn-close" (click)="closeApproveModal()"></button>
      </div>
      <div class="modal-body">

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ <span class="text-danger">*</span></label>
            <input type="date" class="form-control" [formControl]="approveDate"
              [class.is-invalid]="approveDate.invalid && approveDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลา <span class="text-danger">*</span></label>
            <input type="time" class="form-control" [formControl]="approveTime"
              [class.is-invalid]="approveTime.invalid && approveTime.touched">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">จำนวน <span class="text-danger">*</span></label>
            <input type="number" class="form-control" [formControl]="approveQty" placeholder="0"
              [class.is-invalid]="approveQty.invalid && approveQty.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">หน่วยนับ <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [formControl]="approveUnit" placeholder="เช่น ชิ้น, กล่อง"
              [class.is-invalid]="approveUnit.invalid && approveUnit.touched">
          </div>
        </div>

        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="sampleCheck" [formControl]="isCreateSample">
            <label class="form-check-label font-weight-bold" for="sampleCheck">ขึ้นตัวอย่าง</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <textarea class="form-control" rows="3" [formControl]="approveRemarks"
            placeholder="หมายเหตุเพิ่มเติม..."></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeApproveModal()">ยกเลิก</button>

        <button type="button" class="btn btn-success" (click)="confirmApprove()"
          [disabled]="approveDate.invalid || approveTime.invalid || approveQty.invalid || approveUnit.invalid">
          ยืนยันอนุมัติ
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showEditModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger">ระบุรายละเอียดการแก้ไข</h5>
        <button type="button" class="btn-close" (click)="closeEditModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label font-weight-bold">สาเหตุ/รายละเอียดที่ต้องแก้ไข <span
              class="text-danger">*</span></label>
          <textarea class="form-control" rows="4" [formControl]="editNote" placeholder="ระบุสิ่งที่ต้องการให้แก้ไข..."
            [class.is-invalid]="editNote.invalid && editNote.touched"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeEditModal()">ยกเลิก</button>
        <button type="button" class="btn btn-danger" (click)="confirmEdit()" [disabled]="editNote.invalid">
          ยืนยันส่งแก้ไข
        </button>
      </div>
    </div>
  </div>
</div>
