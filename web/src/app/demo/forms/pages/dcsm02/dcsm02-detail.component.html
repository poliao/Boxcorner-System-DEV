<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="designForm" class="row g-3">
        <div class="col-12 d-flex  gap-2 mt-4">
          <button *ngIf="isBtnApprove == true" (click)="Complete()" class="btn text-white px-5 shadow-sm"
            style="background-color: #2c005f;">
            สำเร็จ
          </button>
          <button *ngIf="isBtnApprove == true" (click)="openApproveProductModal()" class="btn text-white px-5 shadow-sm"
            style="background-color: #16bd2c;">
            อนุมัติไปตารางผลิต
          </button>
          <button *ngIf="isBtnApprove == true" (click)="openApproveSampleModal()" class="btn text-white px-5 shadow-sm"
            style="background-color: #050046;">
            อนุมัติไปตารางสั่งงานตัวอย่าง
          </button>
          <button *ngIf="isBtnApprove == true" (click)="openEditModal()" class="btn text-white px-5 shadow-sm"
            style="background-color: #b61a1a;">
            แก้ไข
          </button>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="isEditMode" (click)="onCopy()" type="button" class="btn text-white px-5 shadow-sm"
            style="background-color: #ff8c00;">
            คัดลอก
          </button>
          <button *ngIf="isBtnSave == true" (click)="onSubmit()" type="submit" class="btn text-white px-5 shadow-sm"
            [disabled]="designForm.invalid" style="background-color: #1e1b4b;">
            {{ isEditMode ? 'อัปเดตข้อมูล' : 'บันทึกข้อมูล' }}
          </button>
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="id" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">JOId<span style="color: red;"
              *ngIf="!designForm.get('qpId')?.value">*</span></label>
          <input type="text" formControlName="joId" class="form-control"
            [class.is-invalid]="designForm.get('joId')?.invalid && designForm.get('joId')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">QTId</label>
          <input type="text" formControlName="qtId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">QPId</label>
          <input type="text" formControlName="qpId" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน<span style="color: red;">*</span></label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="designForm.get('folder_name')?.invalid && designForm.get('folder_name')?.touched">
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">ชื่อลูกค้า</label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">Version</label>
          <input type="text" formControlName="version" class="form-control" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">รายละเอียดงาน<span style="color: red;">*</span></label>
          <input type="text" formControlName="jobDetails" class="form-control" placeholder="ระบุรายละเอียดงาน">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันส่ง<span style="color: red;">*</span></label>
          <input type="date" formControlName="deadlineDate" class="form-control"
            [class.is-invalid]="designForm.get('deadlineDate')?.invalid && designForm.get('deadlineDate')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เวลาส่ง<span style="color: red;">*</span></label>
          <input type="time" formControlName="deadlineTime" class="form-control"
            [class.is-invalid]="designForm.get('deadlineTime')?.invalid && designForm.get('deadlineTime')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ</label>
          <input type="text" formControlName="assignee" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">สถานะดำเนินการ</label>
          <input type="text" formControlName="processStatus" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">สถานะคอนเฟิร์ม</label>
          <input type="text" formControlName="confirmStatus" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="date" formControlName="orderDate" class="form-control"
            [class.is-invalid]="designForm.get('orderDate')?.invalid && designForm.get('orderDate')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เวลาสั่งงาน</label>
          <input type="text" class="form-control" [value]="getTimeOnly('orderTime')" readonly disabled>
        </div>
        <div class="col-md-8" *ngIf="isFileName">
          <label class="form-label font-weight-bold">ชื่อไฟล์ล่าสุด</label>
          <input type="text" formControlName="fileName" class="form-control"
            style="background-color: #ff7b00; color: white;">
        </div>
        <div class="col-md-12"
          *ngIf="designForm.getRawValue().remarkAdd != null && designForm.getRawValue().remarkAdd != 'เพิ่มรายละเอียดแล้ว'">
          <label class="form-label font-weight-bold">ขอรายละเอียดเพิ่มเติม</label>
          <textarea type="text" formControlName="remarkAdd" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <textarea formControlName="remarks" class="form-control" rows="3" placeholder="หมายเหตุเพิ่มเติม"></textarea>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showApproveModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">อนุมัติข้อมูลไปยัง ตารางสั่งงานตัวอย่าง</h5>
        <button type="button" class="btn-close" (click)="closeApproveModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ <span style="color: red;">*</span></label>
            <input type="date" class="form-control" [formControl]="approveDate"
              [class.is-invalid]="approveDate.invalid && approveDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลา <span style="color: red;">*</span></label>
            <input type="time" class="form-control" [formControl]="approveTime"
              [class.is-invalid]="approveTime.invalid && approveTime.touched">
          </div>
        </div>
        <div class="row mb-3" *ngIf="isCreateSample.value">
          <div class="col-6">
            <label class="form-label font-weight-bold">จำนวน <span style="color: red;">*</span></label>
            <input type="number" class="form-control" [formControl]="approveQty" placeholder="0"
              [class.is-invalid]="approveQty.invalid && approveQty.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">หน่วยนับ <span style="color: red;">*</span></label>
            <input type="text" class="form-control" [formControl]="approveUnit" placeholder="เช่น ชิ้น, กล่อง"
              [class.is-invalid]="approveUnit.invalid && approveUnit.touched">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="sampleCheck" [formControl]="isCreateSample">
              <label class="form-check-label font-weight-bold" for="sampleCheck">ขึ้นตัวอย่าง</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="print2Page" [formControl]="print2Page">
              <label class="form-check-label font-weight-bold" for="print2Page">พิมพ์ 2 หน้า</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <textarea class="form-control" rows="3" [formControl]="approveRemarks"
            placeholder="หมายเหตุเพิ่มเติม..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeApproveModal()">ยกเลิก</button>
        <button type="button" class="btn btn-success" (click)="confirmApprove()"
          [disabled]="jobId.invalid || approveDate.invalid || approveTime.invalid || (isCreateSample.value && (approveQty.invalid || approveUnit.invalid ))">
          ยืนยันอนุมัติ
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="showEditModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger">ระบุรายละเอียดการแก้ไข</h5>
        <button type="button" class="btn-close" (click)="closeEditModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label font-weight-bold">สาเหตุ/รายละเอียดที่ต้องแก้ไข <span
              class="text-danger">*</span></label>
          <textarea class="form-control" rows="4" [formControl]="editNote" placeholder="ระบุสิ่งที่ต้องการให้แก้ไข..."
            [class.is-invalid]="editNote.invalid && editNote.touched"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeEditModal()">ยกเลิก</button>
        <button type="button" class="btn btn-danger" (click)="confirmEdit()" [disabled]="editNote.invalid">
          ยืนยันส่งแก้ไข
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showApproveProductModal"
  style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">อนุมัติข้อมูลไปยัง ตารางคอนเฟิร์มรอผลิต</h5>
        <button type="button" class="btn-close" (click)="closeApproveProductModal()"></button>
      </div>
      <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">รหัสงาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" [formControl]="jobId"
              [class.is-invalid]="jobId.invalid && jobId.touched">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">ใช้ไฟล์<span style="color: red;">*</span></label>
            <input type="text" class="form-control" [formControl]="usedFile"
              [class.is-invalid]="usedFile.invalid && usedFile.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">ตัวอย่างสี</label>
            <input type="text" class="form-control" [formControl]="colorSample"
              [class.is-invalid]="colorSample.invalid && colorSample.touched">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ส่งงานลูกค้า <span style="color: red;">*</span></label>
            <input type="date" class="form-control" [formControl]="deadlineDate"
              [class.is-invalid]="deadlineDate.invalid && deadlineDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลาส่งงานลูกค้า <span style="color: red;">*</span></label>
            <input type="time" class="form-control" [formControl]="deadlineTime"
              [class.is-invalid]="deadlineTime.invalid && deadlineTime.touched">
          </div>
        </div>
        <div class="col-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="print2Page" [formControl]="print2Page">
            <label class="form-check-label font-weight-bold" for="print2Page">พิมพ์ 2 หน้า</label>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุ </label>
            <textarea class="form-control" rows="3" [formControl]="remarks" placeholder="หมายเหตุเพิ่มเติม..."
              [class.is-invalid]="remarks.invalid && remarks.touched"></textarea>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">เงื่อนไขการรันงาน (ผู้มีอำนาจตัดสินใจ) </label>
            <div class="border rounded p-3" style="background-color: #f8f9fa;">
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="customerOnSite"
                  id="customerOnSite">
                <label class="form-check-label" for="customerOnSite">
                  <strong>ลูกค้าเข้าดูงานหน้างาน</strong> <span class="text-muted">(ผู้ตัดสินใจ: ลูกค้า)</span><br>
                  <small class="text-muted">รันตามที่ลูกค้าอนุมัติหน้าแท่น ถือว่ายอมรับสภาพงานขณะนั้น</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="sampleToCustomer"
                  id="sampleToCustomer">
                <label class="form-check-label" for="sampleToCustomer">
                  <strong>ขึ้นตัวอย่างหน้าแท่นส่งให้ลูกค้าตรวจ</strong> <span class="text-muted">(ผู้ตัดสินใจ:
                    ลูกค้า)</span><br>
                  <small class="text-muted">รันตามที่ลูกค้าอนุมัติหน้าแท่น ถือว่ายอมรับสภาพงานขณะนั้น</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="salesDecision"
                  id="salesDecision">
                <label class="form-check-label" for="salesDecision">
                  <strong>เซลล์ตัดสินใจแทนลูกค้า</strong> <span class="text-muted">(ผู้ตัดสินใจ: เซลล์)</span><br>
                  <small class="text-muted">รันตามคำสั่งเซลล์ ช่างและ QA ไม่ปรับนอกเหนือคำสั่ง</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="planningDecision"
                  id="planningDecision">
                <label class="form-check-label" for="planningDecision">
                  <strong>ฝ่ายแผนตัดสินใจ</strong> <span class="text-muted">(ผู้ตัดสินใจ: ฝ่ายแผน)</span><br>
                  <small class="text-muted">รันตามใบปรู๊ฟและมาตรฐานโรงงาน</small>
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority"
                  value="operatorQaDecision" id="operatorQaDecision">
                <label class="form-check-label" for="operatorQaDecision">
                  <strong>ช่างพิมพ์ + QA ตัดสินใจร่วมกัน</strong> <span class="text-muted">(ผู้ตัดสินใจ: ช่างพิมพ์ /
                    QA)</span><br>
                  <small class="text-muted">ปรับสีให้อยู่ในกรอบมาตรฐานโรงงาน ต้องบันทึกเหตุผล</small>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุเงื่อนไขการรันงาน </label>
            <textarea class="form-control" rows="3" [formControl]="decisionAuthorityRemarks"
              placeholder="หมายเหตุเพิ่มเติม..."
              [class.is-invalid]="decisionAuthorityRemarks.invalid && decisionAuthorityRemarks.touched"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeApproveProductModal()">ยกเลิก</button>
        <button type="button" class="btn btn-success" (click)="confirmApproveProduction()"
          [disabled]="usedFile.invalid || colorSample.invalid || deadlineDate.invalid || deadlineTime.invalid || remarks.invalid || !decisionAuthority.value">
          ยืนยันอนุมัติ
        </button>
      </div>
    </div>
  </div>
</div>
