<h2 >ตารางสั่งงานออกแบบ</h2>
<div class="card-body" >
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหา ID...</mat-label>
            <input type="text" matInput [(ngModel)]="filterId" (keyup.enter)="onSearchChange()">
          </mat-form-field>
        </div>

        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหารายละเอียดงาน...</mat-label>
            <input type="text" matInput [(ngModel)]="filterjobdetails" [matAutocomplete]="autoJob"
              (input)="onJobSearch($event)" (keyup.enter)="onSearchChange()">
            <mat-autocomplete #autoJob="matAutocomplete" (optionSelected)="onSearchChange()">
              <mat-option style="font-family: 'Prompt', sans-serif;" value="">-- ทั้งหมด --</mat-option>
              <mat-option style="font-family: 'Prompt', sans-serif;" *ngFor="let id of jobdetailsList" [value]="id">{{id}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหาเจ้าของงาน...</mat-label>
            <input type="text" matInput [(ngModel)]="filterowner" [matAutocomplete]="autoOwner"
              (input)="onOwnerSearch($event)" (keyup.enter)="onSearchChange()">
            <mat-autocomplete #autoOwner="matAutocomplete" (optionSelected)="onSearchChange()">
              <mat-option style="font-family: 'Prompt', sans-serif;" value="">-- ทั้งหมด --</mat-option>
              <mat-option style="font-family: 'Prompt', sans-serif;" *ngFor="let id of OwnerList" [value]="id">{{id}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหาผู้รับผิดชอบ...</mat-label>
            <input type="text" matInput [(ngModel)]="filterassignee" [matAutocomplete]="autoAssignee"
              (input)="onAssigneeSearch($event)" (keyup.enter)="onSearchChange()">
            <mat-autocomplete #autoAssignee="matAutocomplete" (optionSelected)="onSearchChange()">
              <mat-option style="font-family: 'Prompt', sans-serif;" value="">-- ทั้งหมด --</mat-option>
              <mat-option style="font-family: 'Prompt', sans-serif;" *ngFor="let id of Assignee" [value]="id">{{id}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหาสถานะงาน...</mat-label>
            <input type="text" matInput [(ngModel)]="filterprocess" [matAutocomplete]="autoProcess"
              (input)="onProcessSearch($event)" (keyup.enter)="onSearchChange()">
            <mat-autocomplete #autoProcess="matAutocomplete" (optionSelected)="onSearchChange()">
              <mat-option style="font-family: 'Prompt', sans-serif;" value="">-- ทั้งหมด --</mat-option>
              <mat-option style="font-family: 'Prompt', sans-serif;" *ngFor="let id of Process" [value]="id">{{id}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-4">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">ค้นหาสถานะคอนเฟิร์ม...</mat-label>
            <input type="text" matInput [(ngModel)]="filterconfirm" [matAutocomplete]="autoConfirm"
              (input)="onConfirmSearch($event)" (keyup.enter)="onSearchChange()">
            <mat-autocomplete #autoConfirm="matAutocomplete" (optionSelected)="onSearchChange()">
              <mat-option style="font-family: 'Prompt', sans-serif;" value="">-- ทั้งหมด --</mat-option>
              <mat-option style="font-family: 'Prompt', sans-serif;" *ngFor="let id of Confirm" [value]="id">{{id}}</mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-2">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">วันที่เริ่มต้น</mat-label>
            <input style="font-family: 'Prompt', sans-serif;" matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" (dateChange)="onStartDateChange()"
              placeholder="วว/ดด/ปปปป">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-12 col-md-2">
          <mat-form-field appearance="outline" class="w-100 hide-subscript">
            <mat-label style="font-family: 'Prompt', sans-serif;">วันที่สิ้นสุด</mat-label>
            <input style="font-family: 'Prompt', sans-serif;" matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" [disabled]="!startDate" [min]="startDate"
              (dateChange)="onEndDateChange()" placeholder="วว/ดด/ปปปป">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="col-12">
          <div class="row g-2">
            <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
              <button mat-stroked-button color="warn" class="w-100 px-3" (click)="clearAllFilters()" 
                style="font-family: 'Prompt', sans-serif; color: #003747;" >
                <mat-icon>clear_all</mat-icon> ล้างค่า
              </button>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
              <button mat-flat-button color="accent" class="w-100 px-3" (click)="onSearchChange()" style="background-color: #003747;">
                <mat-icon>search</mat-icon> ค้นหา
              </button>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
              <button mat-flat-button color="primary" class="w-100 px-3" (click)="add()" style="background-color: #003747;">
                <mat-icon>add_circle</mat-icon> เพิ่มข้อมูล
              </button>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
              <button mat-flat-button color="accent" class="w-100 px-3" (click)="onSearchSort()" style="background-color: #003747;">
                <mat-icon>sort</mat-icon> <span class="d-none d-lg-inline">เรียงตามวันส่งลูกค้า</span><span class="d-lg-none">เรียงตามวันส่ง</span>
              </button>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
              <button mat-flat-button color="accent" class="w-100 px-3 position-relative" (click)="onFilterCheck()"
                style="background: #003747; color: #ffffff;">
                <mat-icon>search</mat-icon> <span class="d-none d-lg-inline">งานที่รอตรวจสอบ</span>
                <span *ngIf="checked > 0"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size: 0.75rem; border: 2px solid #fff;">
                  {{ checked }}
                  <span class="visually-hidden">unread messages</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #003747; color: #ffffff;'" [columns]="tableColumns" [data]="tableData" [totalElements]="totalElements" [pageSize]="pageSize"
    [pageIndex]="pageIndex" [clickableColumn]="'id'" (pageChange)="onPageChange($event)"
    (rowClick)="onRowClick($event)">
  </app-data-table>
