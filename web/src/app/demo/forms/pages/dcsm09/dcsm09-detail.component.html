<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="isCheckMold == true" (click)="updateMoldStatus()" type="submit"
            class="btn text-white px-5 shadow-sm" style="background-color: #2ace24;">
            ตรวจไฟล์แม่พิมพ์แล้ว
          </button>
          <button *ngIf="isOrder == true" (click)="updateOrder()" type="submit" class="btn text-white px-5 shadow-sm"
            style="background-color: #2ace24;">
            ตรวจใบสั่งแล้ว
          </button>
          <button *ngIf="isSendOrder == true" (click)="updateSendOrder()" type="submit"
            class="btn text-white px-5 shadow-sm" style="background-color: #2ace24;">
            ส่งใบสั่งผลิตแล้ว
          </button>
          <button *ngIf="isSendFile == true" (click)="updateSendFile()" type="submit"
            class="btn text-white px-5 shadow-sm" style="background-color: #2ace24;">
            ส่งไฟล์แล้ว
          </button>
          <button *ngIf="isDelivery == true" class="btn text-white px-5 shadow-sm" type="button" (click)="add()"
            style="background-color: #00b7c4;">
            เพิ่มข้อมูลไปตารางจัดส่ง
          </button>
        </div>

        <div class="col-md-4">
          <label class="form-label font-weight-bold">JOId <span *ngIf="!mainForm.get('qpId')?.value"
              style="color: red;">*</span></label>
          <input type="text" class="form-control" formControlName="jobId">
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">QTId</label>
          <input type="text" class="form-control" formControlName="qtId">
        </div>
        <div class="col-md-4">
          <label class="form-label font-weight-bold">QPId</label>
          <input type="text" class="form-control" formControlName="qpId">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="date" formControlName="orderDate" class="form-control"
            [class.is-invalid]="mainForm.get('order_date')?.invalid && mainForm.get('order_date')?.touched">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาที่สั่งงาน</label>
          <input type="time" formControlName="createdTime" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน</label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="mainForm.get('folder_name')?.invalid && mainForm.get('folder_name')?.touched">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ใช้ไฟล์</label>
          <input type="text" formControlName="usedFile" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สีตัวอย่าง</label>
          <input type="text" formControlName="colorSample" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ส่งงานลูกค้า</label>
          <input type="date" formControlName="deadlineDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาส่งงานลูกค้า</label>
          <input type="time" formControlName="deadlineTime" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ผู้รับผิดชอบต้องส่ง</label>
          <input type="date" formControlName="deliveryDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะงาน</label>
          <input type="text" formControlName="jobStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะดำเนินการ</label>
          <input type="text" formControlName="processStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">สถานะแม่พิมพ์</label>
          <input type="text" formControlName="moldStatus" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ</label>
          <input type="text" formControlName="operatorName" class="form-control">
        </div>
        <div class="col-md-9">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <input type="text" formControlName="remarks" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ประเภทงาน</label>
          <input type="text" formControlName="jobType" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">ผู้ตรวจ</label>
          <input type="text" formControlName="inspector" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อลูกค้า</label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า">
        </div>
        <!-- <div class="col-md-3">
          <label class="form-label font-weight-bold">อัพเดทล่าสุด</label>
          <input type="text" formControlName="updatedAt" class="form-control" >
        </div> -->
      </form>
    </div>
  </div>
</div>

<div class="card total-income-card warning overflow-hidden mt-3">
  <div class="card-header" style="background-color: #1e1b4b; color: white; padding: 15px;">
    <h6 class="mb-0 font-weight-bold">
      <i class="fas fa-user-check me-2"></i>ผู้มีอำนาจตัดสินใจ
    </h6>
  </div>
  <div class="card-body" style="padding: 15px;">
    <form [formGroup]="mainForm">
      <div class="d-flex flex-wrap gap-2">
        <label class="border rounded p-2 shadow-sm flex-fill position-relative" for="customerOnSite"
          style="border-left: 4px solid #0d6efd !important; min-width: 200px; cursor: pointer;">
          <input class="form-check-input position-absolute" type="radio" formControlName="decisionAuthority"
            value="customerOnSite" id="customerOnSite" style="top: 10px; right: 10px;">
          <strong class="text-primary d-block" style="font-size: 0.9rem;">ลูกค้าเข้าดูงานหน้างาน</strong>
          <span class="badge bg-info text-dark mt-1" style="font-size: 0.7rem;">ลูกค้า</span>
          <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">รันตามที่ลูกค้าอนุมัติหน้าแท่น</small>
        </label>
        <label class="border rounded p-2 shadow-sm flex-fill position-relative" for="sampleToCustomer"
          style="border-left: 4px solid #198754 !important; min-width: 200px; cursor: pointer;">
          <input class="form-check-input position-absolute" type="radio" formControlName="decisionAuthority"
            value="sampleToCustomer" id="sampleToCustomer" style="top: 10px; right: 10px;">
          <strong class="text-success d-block" style="font-size: 0.9rem;">ขึ้นตัวอย่างส่งลูกค้าตรวจ</strong>
          <span class="badge bg-info text-dark mt-1" style="font-size: 0.7rem;">ลูกค้า</span>
          <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">รันตามที่ลูกค้าอนุมัติหน้าแท่น</small>
        </label>
        <label class="border rounded p-2 shadow-sm flex-fill position-relative" for="salesDecision"
          style="border-left: 4px solid #ffc107 !important; min-width: 200px; cursor: pointer;">
          <input class="form-check-input position-absolute" type="radio" formControlName="decisionAuthority"
            value="salesDecision" id="salesDecision" style="top: 10px; right: 10px;">
          <strong class="text-warning d-block" style="font-size: 0.9rem;">เซลล์ตัดสินใจแทนลูกค้า</strong>
          <span class="badge bg-warning text-dark mt-1" style="font-size: 0.7rem;">เซลล์</span>
          <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">รันตามคำสั่งเซลล์ ไม่ปรับนอกคำสั่ง</small>
        </label>
        <label class="border rounded p-2 shadow-sm flex-fill position-relative" for="planningDecision"
          style="border-left: 4px solid #6c757d !important; min-width: 200px; cursor: pointer;">
          <input class="form-check-input position-absolute" type="radio" formControlName="decisionAuthority"
            value="planningDecision" id="planningDecision" style="top: 10px; right: 10px;">
          <strong class="text-secondary d-block" style="font-size: 0.9rem;">ฝ่ายแผนตัดสินใจ</strong>
          <span class="badge bg-secondary mt-1" style="font-size: 0.7rem;">ฝ่ายแผน</span>
          <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">รันตามใบปรู๊ฟและมาตรฐาน</small>
        </label>
        <label class="border rounded p-2 shadow-sm flex-fill position-relative" for="operatorQaDecision"
          style="border-left: 4px solid #dc3545 !important; min-width: 200px; cursor: pointer;">
          <input class="form-check-input position-absolute" type="radio" formControlName="decisionAuthority"
            value="operatorQaDecision" id="operatorQaDecision" style="top: 10px; right: 10px;">
          <strong class="text-danger d-block" style="font-size: 0.9rem;">ช่างพิมพ์ + QA ร่วมกัน</strong>
          <span class="badge bg-danger mt-1" style="font-size: 0.7rem;">ช่าง/QA</span>
          <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">ปรับสีให้อยู่ในมาตรฐาน บันทึกเหตุผล</small>
        </label>
      </div>
      <div class="mt-3" *ngIf="mainForm.get('decisionAuthority')?.value">
        <label class="form-label font-weight-bold">หมายเหตุผู้มีอำนาจตัดสินใจ</label>
        <textarea formControlName="decisionAuthorityRemarks" class="form-control" rows="2"
          placeholder="ระบุหมายเหตุเพิ่มเติม (ถ้ามี)"></textarea>
      </div>
    </form>
  </div>
</div>
