<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="productionForm" class="row g-3">
        
        <!-- ปุ่มดำเนินการ -->
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button (click)="onSubmit()" type="submit" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            บันทึก
          </button>
          <button *ngIf="isPrint == true" (click)="onUpdatePrint('Print')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            พิมพ์
          </button>
          <button *ngIf="isCoating == true" (click)="onUpdatePrint('Coating')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            เคลือบ
          </button>
          <button *ngIf="isStamping == true" (click)="onUpdatePrint('Stamping')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            ปั้ม
          </button>
          <button *ngIf="isGluing == true" (click)="onUpdatePrint('Gluing')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            ปะ
          </button>
          <button *ngIf="isQc == true" (click)="onUpdatePrint('Qc')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
            QC
          </button>
          <button *ngIf="isAddress == true" (click)="onUpdatePrint('Address')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
           รอที่อยู่จัดส่ง
          </button>
          <button *ngIf="isWaitDelivery == true" (click)="onUpdatePrint('WaitDelivery')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
           รอจัดส่ง
          </button>
          <button *ngIf="isDelivery == true" (click)="onUpdatePrint('Delivery')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
           กำลังจัดส่ง
          </button>
          <button *ngIf="isDeliveryComplete == true" (click)="onUpdatePrint('DeliveryComplete')" type="button" class="btn text-white px-5 shadow-sm"
            [disabled]="productionForm.invalid" style="background-color: #1e1b4b;">
           จัดส่งเรียบร้อย
          </button>
        </div>

        <div class="col-12">
          <h5 class="mb-3 text-primary">ข้อมูลทั่วไป</h5>
        </div>

        <div class="col-md-4">
          <label class="form-label font-weight-bold">วันที่ <span style="color: red;">*</span></label>
          <input type="date" formControlName="date" class="form-control"
            [class.is-invalid]="productionForm.get('date')?.invalid && productionForm.get('date')?.touched">
        </div>

        <div class="col-md-4">
          <label class="form-label font-weight-bold">JOB <span style="color: red;">*</span></label>
          <input type="text" formControlName="jobId" class="form-control" placeholder="เช่น JO6901-0098"
            [class.is-invalid]="productionForm.get('jobId')?.invalid && productionForm.get('jobId')?.touched">
        </div>

        <div class="col-md-12">
          <label class="form-label font-weight-bold">ชื่อลูกค้า/ชื่องาน <span style="color: red;">*</span></label>
          <input type="text" formControlName="customerJobName" class="form-control" 
            placeholder="ระบุชื่อบริษัทลูกค้าและรายละเอียดชื่องาน"
            [class.is-invalid]="productionForm.get('customerJobName')?.invalid && productionForm.get('customerJobName')?.touched">
        </div>

        <!-- ส่วนปริมาณการผลิต (Quantities) -->
        <div class="col-12 mt-4">
          <h5 class="mb-3 text-primary">ปริมาณการผลิต</h5>
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">ยอดใบพิมพ์ จำนวน</label>
          <input type="number" formControlName="printQuantity" class="form-control" placeholder="0">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold">ยอดผลิต/กล่อง จำนวน</label>
          <input type="number" formControlName="productionQuantity" class="form-control" placeholder="0">
        </div>

        <!-- ส่วนติดตามกระบวนการผลิต (Production Workflow Grid) -->
        <div class="col-12 mt-4">
          <h5 class="mb-3 text-primary">ติดตามกระบวนการผลิต</h5>
        </div>

        <!-- งานพิมพ์ -->
        <div class="col-12">
          <div class="row border rounded p-3 mb-3">
            <div class="col-12 mb-2">
              <h6 class="text-secondary">งานพิมพ์ (Printing)</h6>
            </div>
            <div class="col-md-6">
              <label class="form-label">วันที่</label>
              <input type="date" formControlName="printingDate" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">บริษัท/ผู้รับผิดชอบ</label>
              <select formControlName="printingResponsible" class="form-control">
                <option value="">เลือก...</option>
                <option value="BCA">BCA</option>
                <option value="อื่นๆ">อื่นๆ</option>
              </select>
            </div>
          </div>
        </div>

        <!-- งานเคลือบ -->
        <div class="col-12">
          <div class="row border rounded p-3 mb-3">
            <div class="col-12 mb-2">
              <h6 class="text-secondary">งานเคลือบ (Coating)</h6>
            </div>
            <div class="col-md-6">
              <label class="form-label">วันที่</label>
              <input type="date" formControlName="coatingDate" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">บริษัท/ผู้รับผิดชอบ</label>
              <select formControlName="coatingResponsible" class="form-control">
                <option value="">เลือก...</option>
                <option value="งานนอก">งานนอก</option>
                <option value="งานใน">งานใน</option>
              </select>
            </div>
          </div>
        </div>

        <!-- งานปั๊ม -->
        <div class="col-12">
          <div class="row border rounded p-3 mb-3">
            <div class="col-12 mb-2">
              <h6 class="text-secondary">งานปั๊ม (Stamping)</h6>
            </div>
            <div class="col-md-6">
              <label class="form-label">วันที่</label>
              <input type="date" formControlName="stampingDate" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">บริษัท/ผู้รับผิดชอบ</label>
              <select formControlName="stampingResponsible" class="form-control">
                <option value="">เลือก...</option>
                <option value="งานนอก">งานนอก</option>
                <option value="งานใน">งานใน</option>
              </select>
            </div>
          </div>
        </div>

        <!-- งานปะ -->
        <div class="col-12">
          <div class="row border rounded p-3 mb-3">
            <div class="col-12 mb-2">
              <h6 class="text-secondary">งานปะ (Gluing/Patching)</h6>
            </div>
            <div class="col-md-6">
              <label class="form-label">วันที่</label>
              <input type="date" formControlName="gluingDate" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">บริษัท/ผู้รับผิดชอบ</label>
              <select formControlName="gluingResponsible" class="form-control">
                <option value="">เลือก...</option>
                <option value="งานนอก">งานนอก</option>
                <option value="งานใน">งานใน</option>
              </select>
            </div>
          </div>
        </div>

        <!-- QC/QA -->
        <div class="col-12">
          <div class="row border rounded p-3 mb-3">
            <div class="col-12 mb-2">
              <h6 class="text-secondary">QC/QA (Quality Control)</h6>
            </div>
            <div class="col-md-6">
              <label class="form-label">วันที่</label>
              <input type="date" formControlName="qcDate" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">สถานะ</label>
              <select formControlName="qcStatus" class="form-control">
                <option value="">เลือก...</option>
                <option value="QC">QC</option>
                <option value="ไม่ QC">ไม่ QC</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ส่วนสำคัญและจัดส่ง (Delivery & Critical Info) - Red Zone -->
        <div class="col-12 mt-4">
          <h5 class="mb-3 text-danger">ข้อมูลสำคัญและจัดส่ง</h5>
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold text-danger">วันที่กำหนดส่งงาน <span style="color: red;">*</span></label>
          <input type="date" formControlName="dueDate" class="form-control" 
            style="background-color: #ffe6e6;"
            [class.is-invalid]="productionForm.get('dueDate')?.invalid && productionForm.get('dueDate')?.touched">
        </div>

        <div class="col-md-6">
          <label class="form-label font-weight-bold ">สถานะที่สั่งพิมพ์</label>
          <select formControlName="printStatus" class="form-control" style="background-color: #ffffff;">
            <option value="">เลือกสถานะ...</option>
            <option value="เริ่ม">เริ่ม</option>
            <option value="รอวัสดุ">รอวัสดุ</option>
            <option value="กำลังผลิต">กำลังผลิต</option>
            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label font-weight-bold ">ที่อยู่จัดส่ง</label>
          <textarea formControlName="shippingAddress" class="form-control" rows="3" 
            style="background-color: #ffffff;"
            placeholder="ระบุที่อยู่ปลายทาง หรือหมายเหตุการส่งของ"></textarea>
        </div>

      </form>
    </div>
  </div>
</div>
