<div class="card-body p-3">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <div class="col-md-2">
        <h4 class="mb-0 text-primary font-weight-bold">บันทึกข้อมูลการผลิต</h4>
      </div>
      <div class="d-flex flex-wrap gap-2 justify-content-end">
        <div class="btn-group" role="group">
          <button *ngIf="isPrint" (click)="onUpdatePrint('Print')"
            class="btn btn-outline-secondary btn-sm">พิมพ์</button>
          <button *ngIf="isCoating" (click)="onUpdatePrint('Coating')"
            class="btn btn-outline-secondary btn-sm">เคลือบ</button>
          <button *ngIf="isStamping" (click)="onUpdatePrint('Stamping')"
            class="btn btn-outline-secondary btn-sm">ปั๊ม</button>
          <button *ngIf="isGluing" (click)="onUpdatePrint('Gluing')"
            class="btn btn-outline-secondary btn-sm">ปะ</button>
          <button *ngIf="isQc" (click)="onUpdatePrint('Qc')" class="btn btn-outline-secondary btn-sm">ยอดส่ง QC</button>
        </div>

        <button *ngIf="isAddress" (click)="onUpdatePrint('Address')"
          class="btn btn-info btn-sm text-white">รอที่อยู่จัดส่ง</button>
        <button *ngIf="isWaitDelivery" (click)="onUpdatePrint('WaitDelivery')"
          class="btn btn-info btn-sm text-white">รอจัดส่ง</button>
        <button *ngIf="isDelivery" (click)="onUpdatePrint('Delivery')"
          class="btn btn-info btn-sm text-white">กำลังส่ง</button>
        <button *ngIf="isDeliveryComplete" (click)="onUpdatePrint('DeliveryComplete')"
          class="btn btn-info btn-sm text-white">จัดส่งเรียบร้อย</button>
        <button (click)="onSubmit()" type="submit" class="btn btn-primary px-4 shadow-sm"
          [disabled]="productionForm.invalid">
          <i class="fas fa-save me-1"></i> บันทึก
        </button>
      </div>
    </div>

    <div class="card-body bg-light">
      <div class="mb-3" *ngIf="isCreate">
        <form [formGroup]="productionForm">
          <div class="input-group">
            <input type="number" formControlName="oidPap" class="form-control form-control-sm"
              placeholder="กรอก OID PAP">
            <button (click)="onFetchData()" type="button" class="btn btn-outline-primary btn-sm">
              <i class="fas fa-search"></i> ดึงข้อมูล
            </button>
          </div>
        </form>
      </div>
      <form [formGroup]="productionForm" class="row g-3">
        <div class="col-lg-8">
          <div class="card h-100 border-0 shadow-sm p-3">
            <h5 class="text-primary border-bottom pb-2 mb-3">ข้อมูลหลัก</h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-bold small">วันที่ <span class="text-danger">*</span></label>
                <input type="date" formControlName="date" class="form-control form-control-sm">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">JOB ID <span class="text-danger">*</span></label>
                <input type="text" formControlName="jobId" class="form-control form-control-sm">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small">กำหนดส่ง <span class="text-danger">*</span></label>
                <input type="date" formControlName="dueDate"
                  class="form-control form-control-sm border-danger shadow-sm">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold small">ชื่อลูกค้า/ชื่องาน <span class="text-danger">*</span></label>
                <input type="text" formControlName="customerJobName" class="form-control form-control-sm">
              </div>
              <div class="col-6">
                <label class="form-label fw-bold small">สถานะงาน </label>
                <input type="text" formControlName="printStatus" class="form-control form-control-sm">
              </div>
              <div class="col-6">
                <label class="form-label fw-bold small">สถานะจัดส่ง </label>
                <input type="text" formControlName="deliveryStatus" class="form-control form-control-sm">
              </div>
              <div class="col-md-6 mt-3">
                <div class="p-2 bg-white border rounded">
                  <label class="form-label fw-bold small mb-1">ยอดใบพิมพ์</label>
                  <input type="number" formControlName="printQuantity"
                    class="form-control form-control-sm border-0 bg-light" placeholder="0">
                </div>
              </div>
              <div class="col-md-6 mt-3">
                <div class="p-2 bg-white border rounded">
                  <label class="form-label fw-bold small mb-1">ยอดผลิต/กล่อง</label>
                  <input type="number" formControlName="productionQuantity"
                    class="form-control form-control-sm border-0 bg-light" placeholder="0">
                </div>
              </div>
              <div class="col-md-6 mt-3">
                <div class="p-2 bg-white border rounded">
                  <label class="form-label fw-bold small mb-1">จำนวนตั้งเครื่อง</label>
                  <input type="number" formControlName="machineSetupCount"
                    class="form-control form-control-sm border-0 bg-light" placeholder="0">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card h-100 border-0 shadow-sm p-3">
            <h5 class="text-danger border-bottom pb-2 mb-3">ข้อมูลการจัดส่ง</h5>
            <div class="mb-2">
              <label class="form-label fw-bold small">ที่อยู่จัดส่ง</label>
              <textarea formControlName="shippingAddress" class="form-control form-control-sm" rows="3"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold small">หมายเหตุ</label>
              <textarea formControlName="remark" class="form-control form-control-sm" rows="3"></textarea>
            </div>
            <div *ngIf="jobImageUrl">
              <label class="form-label fw-bold small">รูปภาพงาน</label>
              <img [src]="jobImageUrl" class="img-fluid rounded border"
                style="max-height: 200px; width: 100%; object-fit: contain;">
            </div>
          </div>
        </div>

        <div class="col-12 mt-2">
          <div class="card border-0 shadow-sm p-3">
            <h5 class="text-primary border-bottom pb-2 mb-3">กระบวนการผลิต (Production Tracking)</h5>
            <div class="row row-cols-1 row-cols-md-3 row-cols-xl-5 g-3">

              <div class="col">
                <div class="p-2 border-start border-4 border-danger bg-white shadow-sm rounded">
                  <label class="d-block fw-bold small text-danger">งานพิมพ์</label>
                  <input type="date" formControlName="printingDate" class="form-control form-control-sm mb-1 border-0">
                  <input type="text" formControlName="printingResponsible" class="form-control form-control-sm">
                </div>
              </div>

              <div class="col">
                <div class="p-2 border-start border-4 border-warning bg-white shadow-sm rounded">
                  <label class="d-block fw-bold small text-warning">งานเคลือบ</label>
                  <input type="date" formControlName="coatingDate" class="form-control form-control-sm mb-1 border-0">
                  <input type="text" formControlName="coatingResponsible" class="form-control form-control-sm">
                </div>
              </div>

              <div class="col">
                <div class="p-2 border-start border-4 border-primary bg-white shadow-sm rounded">
                  <label class="d-block fw-bold small text-primary">งานปั๊ม</label>
                  <input type="date" formControlName="stampingDate" class="form-control form-control-sm mb-1 border-0">
                  <input type="text" formControlName="stampingResponsible" class="form-control form-control-sm">
                </div>
              </div>

              <div class="col">
                <div class="p-2 border-start border-4 border-info bg-white shadow-sm rounded">
                  <label class="d-block fw-bold small text-info">งานปะ</label>
                  <input type="date" formControlName="gluingDate" class="form-control form-control-sm mb-1 border-0">
                  <input type="text" formControlName="gluingResponsible" class="form-control form-control-sm">
                </div>
              </div>

              <div class="col">
                <div class="p-2 border-start border-4 border-success bg-white shadow-sm rounded">
                  <label class="d-block fw-bold small text-success">QC/QA</label>
                  <input type="date" formControlName="qcDate" class="form-control form-control-sm mb-1 border-0">
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Custom Job Selection Modal -->
<div *ngIf="showJobModal" class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">เลือกใบงาน</h5>
        <button type="button" class="btn-close" (click)="closeJobModal()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-3 text-muted">พบหลายใบงานใน OID นี้ กรุณาเลือกใบงานที่ต้องการ</p>
        <div class="list-group">
          <button *ngFor="let job of availableJobs" type="button" 
            class="list-group-item list-group-item-action"
            (click)="selectJob(job)">
            {{ job.header?.jobCode || 'ไม่ระบุ' }} - {{ job.header?.jobName || 'ไม่ระบุชื่องาน' }}
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeJobModal()">ยกเลิก</button>
      </div>
    </div>
  </div>
</div>
