<h2>ตารางติดตามการผลิต</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <form>
        <div class="row g-3">
          <div class="col-md-4">
            <input type="number" class="form-control" [(ngModel)]="filterId" name="filterId" placeholder="ค้นหา ลำดับ"
              (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" [(ngModel)]="filterJobId" name="filterJobId"
              placeholder="ค้นหา JOB ID" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" [(ngModel)]="filterCustomerName" name="filterCustomerName"
              placeholder="ค้นหา ชื่องาน/ชื่อลูกค้า" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label font-weight-bold">ตัวอย่างหรืองานจริง</label>
            <select class="form-select" [(ngModel)]="filterIssample" name="filterIssample" (change)="onSearchChange()">
              <option value="">ทั้งหมด</option>
              <option value="true">เป็นตัวอย่าง</option>
              <option value="false">ไม่เป็นตัวอย่าง</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label font-weight-bold">สถานะพิมพ์</label>
            <select class="form-select" [(ngModel)]="filterPrintStatus" name="filterPrintStatus"
              (change)="onSearchChange()">
              <option value="">สถานะพิมพ์ ทั้งหมด</option>
              <option value="PENDING">PENDING</option>
              <option value="PAUSED">PAUSED</option>
              <option value="IN_PROGRESS">IN_PROGRESS</option>
              <option value="WAITPAGE2">WAITPAGE2</option>
              <option value="PAUSED_PAGE2">PAUSED_PAGE2</option>
              <option value="IN_PROGRESS_PAGE2">IN_PROGRESS_PAGE2</option>
              <option value="COMPLETED">COMPLETED</option>
            </select>
          </div>
          <div class="col-12">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3" style="background-color: #003747;"
                  (click)="onSearchChange()">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button type="button" class="w-100 px-3" (click)="clearAllFilters()"
                  style="color: #003747;">
                  <mat-icon>refresh</mat-icon> ล้างค่า
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3" style="background-color: #ffa600;"
                  (click)="openCalibrateModal()">
                  <mat-icon>tune</mat-icon> Calibrate
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3 text-white" style="background-color: #e63946;"
                  data-bs-toggle="modal" data-bs-target="#repairPrinterModal">
                  <mat-icon>build</mat-icon> ซ่อมเครื่อง
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #003747; color: #ffffff;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    [rowStyles]="rowStyles" (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>
</div>

<!-- Calibrate Modal -->
<div class="modal fade" [class.show]="showCalibrateModal" [style.display]="showCalibrateModal ? 'block' : 'none'"
  tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Calibrate เครื่องพิมพ์</h5>
        <button type="button" class="btn-close" (click)="closeCalibrateModal()"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label class="form-label">เครื่องพิมพ์<span style="color: red;">*</span></label>
            <select class="form-select" [(ngModel)]="calibrateData.printerId" name="printerId" required>
              <option value="2">Canon</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">ค่า 4 สี เริ่มต้น</label>
            <input type="number" class="form-control" [(ngModel)]="calibrateData.meterColorStart" name="meterColorStart"
              required>
          </div>
          <div class="mb-3">
            <label class="form-label">ค่า 4 สี สิ้นสุด</label>
            <input type="number" class="form-control" [(ngModel)]="calibrateData.meterColorEnd" name="meterColorEnd"
              required>
          </div>
          <div class="mb-3">
            <label class="form-label">ค่าขาวดำ เริ่มต้น</label>
            <input type="number" class="form-control" [(ngModel)]="calibrateData.meterBwStart" name="meterBwStart"
              required>
          </div>
          <div class="mb-3">
            <label class="form-label">ค่าขาวดำ สิ้นสุด</label>
            <input type="number" class="form-control" [(ngModel)]="calibrateData.meterBwEnd" name="meterBwEnd" required>
          </div>
          <div class="mb-3">
            <label class="form-label">หมายเหตุ</label>
            <input type="text" class="form-control" [(ngModel)]="calibrateData.note" name="note">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeCalibrateModal()">ยกเลิก</button>
        <button type="button" class="btn btn-primary" (click)="submitCalibrate()">บันทึก</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showCalibrateModal" *ngIf="showCalibrateModal"></div>

<!-- Modal ซ่อมเครื่อง -->
<div class="modal fade" id="repairPrinterModal" tabindex="-1" aria-labelledby="repairPrinterModalLabel"
  aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header text-white" style="background-color: #e63946;">
        <h5 class="modal-title" id="repairPrinterModalLabel">
          <mat-icon style="vertical-align: middle;">build</mat-icon> แจ้งซ่อมเครื่อง
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"
          id="closeRepairModalBtn"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="repairPrinterForm">
          <!-- เลือกเครื่องพิมพ์ -->
          <div class="row mb-4">
            <div class="col-md-12">
              <label class="form-label fw-bold text-primary">เลือกเครื่องพิมพ์ <span
                  class="text-danger">*</span></label>
              <select formControlName="printerName" class="form-select form-select-lg">
                <option [ngValue]="null" disabled>-- กรุณาเลือกเครื่องพิมพ์ --</option>
                <option value="2">Canon (แคนนอน)</option>
                <option value="1">Ricoh (ริโก้)</option>
              </select>
            </div>
          </div>

          <!-- Color & BW Meters -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="card h-100 border-0 bg-light">
                <div class="card-body">
                  <h6 class="card-title fw-bold text-danger mb-3">มิเตอร์สี (Color) <span class="text-danger">*</span>
                  </h6>
                  <div class="mb-2">
                    <label class="form-label small">เริ่มต้น</label>
                    <input type="number" formControlName="meterColorStart" class="form-control" placeholder="0">
                  </div>
                  <div>
                    <label class="form-label small">สิ้นสุด</label>
                    <input type="number" formControlName="meterColorEnd" class="form-control" placeholder="0">
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card h-100 border-0 bg-light">
                <div class="card-body">
                  <h6 class="card-title fw-bold text-dark mb-3">มิเตอร์ขาวดำ (BW) <span class="text-danger">*</span>
                  </h6>
                  <div class="mb-2">
                    <label class="form-label small">เริ่มต้น</label>
                    <input type="number" formControlName="meterBwStart" class="form-control" placeholder="0">
                  </div>
                  <div>
                    <label class="form-label small">สิ้นสุด</label>
                    <input type="number" formControlName="meterBwEnd" class="form-control" placeholder="0">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Special Color (Ricoh Only) -->
          <div class="row g-3 mb-4" *ngIf="repairPrinterForm.get('printerName')?.value == '1'">
            <div class="col-md-12">
              <div class="card border-0 bg-light">
                <div class="card-body">
                  <h6 class="card-title fw-bold text-info mb-3">มิเตอร์สีพิเศษ (ขาว/White) <span
                      class="text-danger">*</span></h6>
                  <div class="row">
                    <div class="col-md-6">
                      <label class="form-label small">เริ่มต้น</label>
                      <input type="number" formControlName="meterSpecialStart" class="form-control" placeholder="0">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small">สิ้นสุด</label>
                      <input type="number" formControlName="meterSpecialEnd" class="form-control" placeholder="0">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Note -->
          <div class="row">
            <div class="col-md-12">
              <label class="form-label fw-bold">หมายเหตุ</label>
              <textarea formControlName="note" class="form-control" rows="2"
                placeholder="ระบุสาเหตุหรือรายละเอียดการซ่อม"></textarea>
            </div>
          </div>

        </form>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-danger px-4" (click)="saveRepairLog()"
          [disabled]="repairPrinterForm.invalid">
          <mat-icon style="vertical-align: middle; font-size: 18px;">save</mat-icon> บันทึกประวัติซ่อม
        </button>
      </div>
    </div>
  </div>
</div>
