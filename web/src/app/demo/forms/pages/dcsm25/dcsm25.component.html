<h2>ตารางติดตามการผลิต</h2>
<div class="card-body">
  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
    <div class="card-body bg-light">
      <form>
        <div class="row g-3">
          <div class="col-md-4">
            <input type="number" class="form-control" [(ngModel)]="filterId" name="filterId" placeholder="ค้นหา ลำดับ"
              (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" [(ngModel)]="filterJobId" name="filterJobId"
              placeholder="ค้นหา JOB ID" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-4">
            <input type="text" class="form-control" [(ngModel)]="filterCustomerName" name="filterCustomerName"
              placeholder="ค้นหา ชื่องาน/ชื่อลูกค้า" (keyup.enter)="onSearchChange()">
          </div>
          <div class="col-md-3">
            <label class="form-label font-weight-bold">ตัวอย่างหรืองานจริง</label>
            <select class="form-select" [(ngModel)]="filterIssample" name="filterIssample" (change)="onSearchChange()">
              <option value="">ทั้งหมด</option>
              <option value="true">เป็นตัวอย่าง</option>
              <option value="false">ไม่เป็นตัวอย่าง</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label font-weight-bold">สถานะพิมพ์</label>
            <select class="form-select" [(ngModel)]="filterPrintStatus" name="filterPrintStatus"
              (change)="onSearchChange()">
              <option value="">สถานะพิมพ์ ทั้งหมด</option>
              <option value="พิมพ์แล้ว">พิมพ์แล้ว</option>
              <option value="กำลังพิมพ์">กำลังพิมพ์</option>
              <option value="หยุดพิมพ์ชั่วคราว">หยุดพิมพ์ชั่วคราว</option>
              <option value="หยุดพิมพ์หน้า2ชั่วคราว">หยุดพิมพ์หน้า2ชั่วคราว</option>
              <option value="เริ่มพิมพ์ต่อหน้า2">เริ่มพิมพ์ต่อหน้า2</option>
              <option value="กำลังพิมพ์หน้า2">กำลังพิมพ์หน้า2</option>
              <option value="พิมพ์หน้า2แล้ว">พิมพ์หน้า2แล้ว</option>
            </select>
          </div>
          <div class="col-12">
            <div class="row g-2">
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3" style="background-color: #003747;"
                  (click)="onSearchChange()">
                  <mat-icon>search</mat-icon> ค้นหา
                </button>
              </div>
              <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-stroked-button type="button" class="w-100 px-3" (click)="clearAllFilters()"
                  style="color: #003747;">
                  <mat-icon>refresh</mat-icon> ล้างค่า
                </button>
              </div>
              <!-- <div class="col-12 col-sm-6 col-md-4 col-lg-auto">
                <button mat-flat-button type="button" class="w-100 px-3" style="background-color: #ffa600;"
                  (click)="openCalibrateModal()">
                  <mat-icon>tune</mat-icon> Calibrate
                </button>
              </div> -->
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <app-data-table [headerStyle]="'background: #003747; color: #ffffff;'" [columns]="tableColumns" [data]="tableData"
    [totalElements]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex" [clickableColumn]="'id'"
    (pageChange)="onPageChange($event)" (rowClick)="onRowClick($event)">
  </app-data-table>
</div>
