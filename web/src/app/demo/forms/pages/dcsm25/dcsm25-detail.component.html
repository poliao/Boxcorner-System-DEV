<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h1 class="mb-0">งานรอพิมพ์ OD</h1>
    <button *ngIf="isPrint" (click)="onUpdatePrint('Print')" class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">พิมพ์เสร็จ</button>
    <button *ngIf="isInPrint" (click)="onUpdatePrint('inPrint')" class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">เริ่มพิมพ์</button>
  </div>
  
  <div class="card-body">
    <form [formGroup]="printingForm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">วันที่ </label>
          <input type="date" formControlName="date" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">JOB ID</label>
          <input type="text" formControlName="jobId" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label" style=" color: red;">วันที่ต้องส่งงานพิมพ์</label>
          <input type="date" formControlName="printingDate" class="form-control" style="background-color: red; color: #ffffff;">
        </div>
        <div class="col-12">
          <label class="form-label">ชื่อลูกค้า/ชื่องาน</label>
          <input type="text" formControlName="customerJobName" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">สถานะงาน</label>
          <input type="text" formControlName="printStatus" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">ยอดใบพิมพ์</label>
          <input type="number" formControlName="printQuantity" class="form-control" placeholder="0">
        </div>
        <div class="col-md-2">
          <label class="form-label">ยอดผลิต/กล่อง</label>
          <input type="number" formControlName="productionQuantity" class="form-control" placeholder="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">เครื่องพิมพ์</label>
          <input type="text" formControlName="printingResponsible" class="form-control">
        </div>
      </div>
    </form>
  </div>
</div>

<div class="modal fade" [class.show]="showPrintingModal" [style.display]="showPrintingModal ? 'block' : 'none'" 
     tabindex="-1" role="dialog" aria-labelledby="printingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="printingModalLabel">เริ่มต้นการพิมพ์</h5>
        <button type="button" class="btn-close" (click)="closePrintingModal()" aria-label="Close"></button>
      </div>
      <form [formGroup]="printingStartForm" (ngSubmit)="onStartPrinting()">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="meter4colorStart" class="form-label">ค่ามิเตอร์ 4 สี เริ่มต้น <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meter4colorStart" 
                     formControlName="meter4colorStart" placeholder="ค่ามิเตอร์ 4 สี เริ่มต้น"
                     [class.is-invalid]="printingStartForm.get('meter4colorStart')?.invalid && printingStartForm.get('meter4colorStart')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ 4 สี เริ่มต้น
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="meterBwStart" class="form-label">ค่ามิเตอร์ขาวดำ เริ่มต้น<span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meterBwStart" 
                     formControlName="meterBwStart" placeholder="ค่ามิเตอร์ขาวดำ เริ่มต้น"
                     [class.is-invalid]="printingStartForm.get('meterBwStart')?.invalid && printingStartForm.get('meterBwStart')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาวดำ เริ่มต้น
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="workType" class="form-label">ประเภทงาน<span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="workType" 
                     formControlName="workType" placeholder="ประเภทงาน"
                     [class.is-invalid]="printingStartForm.get('workType')?.invalid && printingStartForm.get('workType')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกประเภทงาน
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="printerName" class="form-label">ชื่อเครื่องพิมพ์<span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="printerName" 
                     formControlName="printerName" placeholder="ชื่อเครื่องพิมพ์"
                     [class.is-invalid]="printingStartForm.get('printerName')?.invalid && printingStartForm.get('printerName')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกชื่อเครื่องพิมพ์
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closePrintingModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary" [disabled]="printingStartForm.invalid">เริ่มพิมพ์</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" [class.show]="showPrintingEndModal" [style.display]="showPrintingEndModal ? 'block' : 'none'" 
     tabindex="-1" role="dialog" aria-labelledby="printingEndModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="printingEndModalLabel">พิมพ์เสร็จสิ้น</h5>
        <button type="button" class="btn-close" (click)="closePrintingEndModal()" aria-label="Close"></button>
      </div>
      <form [formGroup]="printingEndForm" (ngSubmit)="onEndPrinting()">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="meter4colorEnd" class="form-label">ค่ามิเตอร์ 4 สี สิ้นสุด <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meter4colorEnd" 
                     formControlName="meter4colorEnd" placeholder="ค่ามิเตอร์ 4 สี สิ้นสุด"
                     [class.is-invalid]="printingEndForm.get('meter4colorEnd')?.invalid && printingEndForm.get('meter4colorEnd')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ 4 สี สิ้นสุด
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="meterBwEnd" class="form-label">ค่ามิเตอร์ขาวดำ สิ้นสุด <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meterBwEnd" 
                     formControlName="meterBwEnd" placeholder="ค่ามิเตอร์ขาวดำ สิ้นสุด"
                     [class.is-invalid]="printingEndForm.get('meterBwEnd')?.invalid && printingEndForm.get('meterBwEnd')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาวดำ สิ้นสุด
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closePrintingEndModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-success" [disabled]="printingEndForm.invalid">พิมพ์เสร็จ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-backdrop fade" [class.show]="showPrintingModal || showPrintingEndModal" 
     [style.display]="showPrintingModal || showPrintingEndModal ? 'block' : 'none'" 
     (click)="closePrintingModal(); closePrintingEndModal()"></div>
