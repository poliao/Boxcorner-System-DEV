<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h1 class="mb-0">งานรอพิมพ์ OD</h1>
    <div class="d-flex gap-2">
      <button *ngIf="isPrint" (click)="onUpdatePrint('Print')" class="btn text-white px-5 shadow-sm"
        style="background-color: #1e1b4b;">พิมพ์เสร็จ</button>
      <button *ngIf="isInPrint" (click)="onUpdatePrint('inPrint')" class="btn text-white px-5 shadow-sm"
        style="background-color: #1e1b4b;">เริ่มพิมพ์</button>
      <button *ngIf="isPrint" (click)="onUpdatePrint('inPrint')" class="btn text-white px-5 shadow-sm"
        style="background-color: #ff2d2d;">หยุดพิมพ์ชั่วคราว</button>
    </div>
  </div>

  <div class="card-body">
    <form [formGroup]="printingForm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">JOB ID</label>
          <input type="text" formControlName="jobId" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label" style=" color: red;">วันที่ต้องส่งงานพิมพ์</label>
          <input type="date" formControlName="deliveryDate" class="form-control"
            style="background-color: red; color: #ffffff;">
        </div>
        <div class="col-md-4" *ngIf="isSample">
          <label class="form-label" style=" color: red;">เวลาต้องส่งงานพิมพ์</label>
          <input type="time" formControlName="deliveryTime" class="form-control"
            style="background-color: red; color: #ffffff;">
        </div>
        <div class="col-md-4">
          <label class="form-label">ชื่อลูกค้า/ชื่องาน</label>
          <input type="text" formControlName="customerJobName" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">สถานะงาน</label>
          <input type="text" formControlName="jobStatus" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">ยอดใบพิมพ์</label>
          <input type="number" formControlName="totalPrintSheets" class="form-control" placeholder="0">
        </div>
        <div class="col-md-2">
          <label class="form-label">ยอดผลิต/กล่อง</label>
          <input type="number" formControlName="productionQty" class="form-control" placeholder="0">
        </div>
        <div class="col-md-2">
          <label class="form-label">เครื่องพิมพ์</label>
          <input type="text" formControlName="printerName" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">งานตัวอย่าง</label>
          <div class="form-check">
            <input type="checkbox" formControlName="issample" class="form-check-input" id="issample">
            <label class="form-check-label" for="issample">
              เป็นงานตัวอย่าง
            </label>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card-body" *ngIf="isSample">
  <div class="card total-income-card info overflow-hidden">
    <div style="padding: 10px;">
      <h5 class="card-title mb-3">รายละเอียดงานพิมพ์</h5>
      <form [formGroup]="printingForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ประเภทงาน</label>
          <input type="text" formControlName="jobType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ระบบพิมพ์</label>
          <input type="text" formControlName="systemPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานพิมพ์</label>
          <input type="text" formControlName="printType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">สีที่พิมพ์</label>
          <input type="text" formControlName="colorPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ขนาดกระดาษ</label>
          <input type="text" formControlName="paperType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">แกรมกระดาษ</label>
          <input type="text" formControlName="paperGram" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานเคลือบ</label>
          <input type="text" formControlName="coatType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานไดคัท</label>
          <input type="text" formControlName="diecuttingType" class="form-control">
        </div>
      </form>
      <br>
    </div>
  </div><br>
</div>

<div class="modal fade" [class.show]="showPrintingModal" [style.display]="showPrintingModal ? 'block' : 'none'"
  tabindex="-1" role="dialog" aria-labelledby="printingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="printingModalLabel">เริ่มต้นการพิมพ์</h5>
        <button type="button" class="btn-close" (click)="closePrintingModal()" aria-label="Close"></button>
      </div>
      <form [formGroup]="printingFormRecord" (ngSubmit)="onStartPrinting()">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="meter4colorStart" class="form-label">ค่ามิเตอร์ 4 สี เริ่มต้น <span class="text-danger"
                  style="color: #ff0000;">*</span></label>
              <input type="number" class="form-control" id="meter4colorStart" formControlName="meter4colorStart"
                placeholder="ค่ามิเตอร์ 4 สี เริ่มต้น"
                [class.is-invalid]="printingFormRecord.get('meter4colorStart')?.invalid && printingFormRecord.get('meter4colorStart')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ 4 สี เริ่มต้น
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="meterBwStart" class="form-label">ค่ามิเตอร์ขาวดำ เริ่มต้น</label>
              <input type="number" class="form-control" id="meterBwStart" formControlName="meterBwStart"
                placeholder="ค่ามิเตอร์ขาวดำ เริ่มต้น"
                [class.is-invalid]="printingFormRecord.get('meterBwStart')?.invalid && printingFormRecord.get('meterBwStart')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาวดำ เริ่มต้น
              </div>
            </div>
            <div class="col-md-6 mb-3" *ngIf="printerName === 'Ricoh'">
              <label for="meterWStart" class="form-label">ค่ามิเตอร์ขาว เริ่มต้น</label>
              <input type="number" class="form-control" id="meterWStart" formControlName="meterWStart"
                placeholder="ค่ามิเตอร์ขาว เริ่มต้น"
                [class.is-invalid]="printingFormRecord.get('meterWStart')?.invalid && printingFormRecord.get('meterWStart')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาว เริ่มต้น
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closePrintingModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary" [disabled]="printingFormRecord.invalid">เริ่มพิมพ์</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" [class.show]="showPrintingEndModal" [style.display]="showPrintingEndModal ? 'block' : 'none'"
  tabindex="-1" role="dialog" aria-labelledby="printingEndModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="printingEndModalLabel">พิมพ์เสร็จสิ้น</h5>
        <button type="button" class="btn-close" (click)="closePrintingEndModal()" aria-label="Close"></button>
      </div>
      <form [formGroup]="printingFormRecord" (ngSubmit)="onEndPrinting()">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="meter4colorEnd" class="form-label">ค่ามิเตอร์ 4 สี สิ้นสุด <span
                  class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meter4colorEnd" formControlName="meter4colorEnd"
                placeholder="ค่ามิเตอร์ 4 สี สิ้นสุด"
                [class.is-invalid]="printingFormRecord.get('meter4colorEnd')?.invalid && printingFormRecord.get('meter4colorEnd')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ 4 สี สิ้นสุด
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="meterBwEnd" class="form-label">ค่ามิเตอร์ขาวดำ สิ้นสุด <span
                  class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meterBwEnd" formControlName="meterBwEnd"
                placeholder="ค่ามิเตอร์ขาวดำ สิ้นสุด"
                [class.is-invalid]="printingFormRecord.get('meterBwEnd')?.invalid && printingFormRecord.get('meterBwEnd')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาวดำ สิ้นสุด
              </div>
            </div>
            <div class="col-md-6 mb-3" *ngIf="printerName === 'Ricoh'">
              <label for="meterWEnd" class="form-label">ค่ามิเตอร์ขาว สิ้นสุด<span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="meterWEnd" formControlName="meterWEnd"
                placeholder="ค่ามิเตอร์ขาว สิ้นสุด"
                [class.is-invalid]="printingFormRecord.get('meterWEnd')?.invalid && printingFormRecord.get('meterWEnd')?.touched">
              <div class="invalid-feedback">
                กรุณากรอกค่ามิเตอร์ขาว สิ้นสุด
              </div>
            </div>
            <div class="col-12 mb-3">
              <label for="issueFound" class="form-label">ปัญหาที่เจอ</label>
              <textarea class="form-control" id="issueFound" rows="3" formControlName="issueFound"
                placeholder="ระบุปัญหาที่เจอ (ถ้ามี)"></textarea>
            </div>
            <div class="col-12 mb-3">
              <label for="issueCause" class="form-label">สาเหตุของปัญหา</label>
              <textarea class="form-control" id="issueCause" rows="3" formControlName="issueCause"
                placeholder="ระบุสาเหตุของปัญหา (ถ้ามี)"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closePrintingEndModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-success" [disabled]="printingFormRecord.invalid">พิมพ์เสร็จ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-backdrop fade" [class.show]="showPrintingModal || showPrintingEndModal"
  [style.display]="showPrintingModal || showPrintingEndModal ? 'block' : 'none'"
  (click)="closePrintingModal(); closePrintingEndModal()"></div>
