<div class="card-body">
  <div class="card total-income-card warning overflow-hidden">
    <div style="padding: 10px;">
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <button *ngIf="isBtnSave == true" (click)="onSubmit()" type="button" class="btn text-white px-5 shadow-sm"
            style="background-color: #1e1b4b;">
            {{ isEditMode ? 'อัปเดตข้อมูล' : 'บันทึกข้อมูล' }}
          </button>
          <button *ngIf="isBtnApproveSample == true" (click)="openApproveModal()" type="button"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            อนุมัติ
          </button>
          <button *ngIf="isUpdateDelivery == true" (click)="updateDelivery()" type="button"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            อนุมัติเลื่อนวันส่ง
          </button>
          <button *ngIf="isUpdateDelivery == true" (click)="updateNotDelivery()" type="button"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            ไม่อนุมัติเลื่อนวันส่ง
          </button>
          <button *ngIf="isBtnApprove == true" (click)="updateFileChecked()" type="button"
            class="btn text-white px-5 shadow-sm" style="background-color: #1e1b4b;">
            ไฟล์ถูกต้อง
          </button>
          <button *ngIf="isBtnApproveSample == true" (click)="openRejectModal()" type="button"
            class="btn btn-danger text-white px-5 shadow-sm">
            ไม่ผ่าน
          </button>
          <button *ngIf="isBtnApproveSample == true" (click)="confirmComplete()" type="button"
            class="btn text-white px-5 shadow-sm" style="background-color: #7b0086;">
            จบงาน
          </button>
        </div>
        <div class="col-md-6" *ngIf="isPap">
          <label class="form-label font-weight-bold">ID</label>
          <div class="input-group">
            <input type="text" formControlName="searchId" class="form-control" placeholder="กรอกเลข ID">
            <button type="button" class="btn btn-primary" (click)="fetchData()">
              ดึงข้อมูล
            </button>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลำดับ</label>
          <input type="text" formControlName="id" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">รหัสงาน <span style="color: red;">*</span></label>
          <input type="text" formControlName="jobId" class="form-control"
            [class.is-invalid]="mainForm.get('jobId')?.invalid && mainForm.get('jobId')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">รหัสใบเสนอราคา</label>
          <input type="text" formControlName="qtId" class="form-control">
        </div>
        <div *ngIf="isDesign" class="col-md-6">
          <label class="form-label font-weight-bold">อ้างอิงตารางสั่งออกแบบ</label>
          <input type="text" formControlName="designOrderId" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">วันที่สั่งงาน</label>
          <input type="text" class="form-control" [value]="getThaiDateInput('orderDate')" readonly disabled
            [class.is-invalid]="mainForm.get('orderDate')?.invalid && mainForm.get('orderDate')?.touched">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เวลาสั่งงาน</label>
          <input type="time" class="form-control" formControlName="orderTime">
        </div>
        <div class="col-md-2">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อโฟลเดอร์งาน<span style="color: red;">*</span></label>
          <input type="text" formControlName="folderName" class="form-control" placeholder="ระบุชื่อโฟลเดอร์"
            [class.is-invalid]="mainForm.get('folderName')?.invalid && mainForm.get('folderName')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ชื่อลูกค้า</label>
          <input type="text" formControlName="customerName" class="form-control" placeholder="ชื่อลูกค้า">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">เจ้าของงาน</label>
          <input type="text" formControlName="jobOwner" class="form-control" placeholder="ชื่อผู้สั่งงาน">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ผู้รับผิดชอบ (Assignee)</label>
          <input type="text" formControlName="responsiblePerson" class="form-control" placeholder="ชื่อผู้ออกแบบ">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">วันที่ต้องส่ง<span style="color: red;">*</span></label>
          <input type="text" #deliveryDateInput class="form-control" (input)="onThaiDateInput($event, 'deliveryDate')"
            [value]="getThaiDateInput('deliveryDate')" [disabled]="mainForm.get('deliveryDate')?.disabled"
            placeholder="วว/ดด/ปป (13/01/26)" maxlength="8">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">เวลาที่ต้องส่ง<span style="color: red;">*</span></label>
          <input type="time" formControlName="deliveryTime" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">สถานะ</label>
          <input type="text" formControlName="status" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">จำนวน<span style="color: red;">*</span></label>
          <input type="number" formControlName="quantity" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label font-weight-bold">หน่วยนับ<span style="color: red;">*</span></label>
          <input type="text" formControlName="unit" class="form-control">
        </div>

        <div class="col-md-3" *ngIf="isUpdateDelivery">
          <label class="form-label font-weight-bold">วันที่ขอเลื่อนส่ง</label>
          <input style="background-color: rgb(255, 136, 0); color: white;" type="text"
            [value]="getThaiDateInput('updateDateDelivery')" class="form-control" readonly>
        </div>
        <div class="col-md-3" *ngIf="isUpdateDelivery">
          <label class="form-label font-weight-bold">เวลาที่ขอเลื่อนส่ง</label>
          <input style="background-color: rgb(255, 136, 0); color: white;" type="time"
            formControlName="updateTimeDelivery" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label font-weight-bold">หมายเหตุ</label>
          <input type="text" formControlName="note" class="form-control" placeholder="หมายเหตุเพิ่มเติม">
        </div>
        <div class="col-md-12">
          <div class="form-check form-switch mt-2"> <input type="checkbox" formControlName="isCreateSample"
              class="form-check-input" id="isCreateSampleSwitch">
            <label class="form-check-label" for="isCreateSampleSwitch">ขึ้นตัวอย่าง </label>
          </div>
          <div class="form-check form-switch mt-2"> <input type="checkbox" formControlName="print2Page"
              class="form-check-input" id="print2Page">
            <label class="form-check-label" for="print2Page">พิมพ์ 2 หน้า </label>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="card-body">
  <div class="card total-income-card info overflow-hidden">
    <div style="padding: 10px;">
      <h5 class="card-title mb-3">รายละเอียดงานพิมพ์</h5>
      <form [formGroup]="mainForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ประเภทงาน</label>
          <input type="text" formControlName="jobType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ระบบพิมพ์</label>
          <input type="text" formControlName="systemPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานพิมพ์</label>
          <input type="text" formControlName="printType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">สีที่พิมพ์</label>
          <input type="text" formControlName="colorPrint" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ขนาดกระดาษ</label>
          <input type="text" formControlName="paperType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">แกรมกระดาษ</label>
          <input type="text" formControlName="paperGram" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานเคลือบ</label>
          <input type="text" formControlName="coatType" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">ลักษณะงานไดคัท</label>
          <input type="text" formControlName="diecuttingType" class="form-control">
        </div>
      </form>
      <br>
    </div>
  </div><br>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showApproveModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">อนุมัติข้อมูลไปยัง ตารางคอนเฟิร์มรอผลิต</h5>
        <button type="button" class="btn-close" (click)="closeApproveModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">ใช้ไฟล์ <span style="color: red;">*</span></label>
            <input type="text" class="form-control" [formControl]="usedFile"
              [class.is-invalid]="usedFile.invalid && usedFile.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">ตัวอย่างสี</label>
            <input type="text" class="form-control" [formControl]="colorSample"
              [class.is-invalid]="colorSample.invalid && colorSample.touched">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ส่งงานลูกค้า <span style="color: red;">*</span></label>
            <input type="date" class="form-control" [formControl]="deadlineDate"
              [class.is-invalid]="deadlineDate.invalid && deadlineDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลาส่งงานลูกค้า <span style="color: red;">*</span></label>
            <input type="time" class="form-control" [formControl]="deadlineTime"
              [class.is-invalid]="deadlineTime.invalid && deadlineTime.touched">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุ </label>
            <textarea class="form-control" rows="3" [formControl]="remarks" placeholder="หมายเหตุเพิ่มเติม..."
              [class.is-invalid]="remarks.invalid && remarks.touched"></textarea>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">เงื่อนไขการรันงาน (ผู้มีอำนาจตัดสินใจ) </label>
            <div class="border rounded p-3" style="background-color: #f8f9fa;">
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="customerOnSite"
                  id="customerOnSite">
                <label class="form-check-label" for="customerOnSite">
                  <strong>ลูกค้าเข้าดูงานหน้างาน</strong> <span class="text-muted">(ผู้ตัดสินใจ: ลูกค้า)</span><br>
                  <small class="text-muted">รันตามที่ลูกค้าอนุมัติหน้าแท่น ถือว่ายอมรับสภาพงานขณะนั้น</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="sampleToCustomer"
                  id="sampleToCustomer">
                <label class="form-check-label" for="sampleToCustomer">
                  <strong>ขึ้นตัวอย่างหน้าแท่นส่งให้ลูกค้าตรวจ</strong> <span class="text-muted">(ผู้ตัดสินใจ:
                    ลูกค้า)</span><br>
                  <small class="text-muted">รันตามที่ลูกค้าอนุมัติหน้าแท่น ถือว่ายอมรับสภาพงานขณะนั้น</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="salesDecision"
                  id="salesDecision">
                <label class="form-check-label" for="salesDecision">
                  <strong>เซลล์ตัดสินใจแทนลูกค้า</strong> <span class="text-muted">(ผู้ตัดสินใจ: เซลล์)</span><br>
                  <small class="text-muted">รันตามคำสั่งเซลล์ ช่างและ QA ไม่ปรับนอกเหนือคำสั่ง</small>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority" value="planningDecision"
                  id="planningDecision">
                <label class="form-check-label" for="planningDecision">
                  <strong>ฝ่ายแผนตัดสินใจ</strong> <span class="text-muted">(ผู้ตัดสินใจ: ฝ่ายแผน)</span><br>
                  <small class="text-muted">รันตามใบปรู๊ฟและมาตรฐานโรงงาน</small>
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" [formControl]="decisionAuthority"
                  value="operatorQaDecision" id="operatorQaDecision">
                <label class="form-check-label" for="operatorQaDecision">
                  <strong>ช่างพิมพ์ + QA ตัดสินใจร่วมกัน</strong> <span class="text-muted">(ผู้ตัดสินใจ: ช่างพิมพ์ /
                    QA)</span><br>
                  <small class="text-muted">ปรับสีให้อยู่ในกรอบมาตรฐานโรงงาน ต้องบันทึกเหตุผล</small>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุเงื่อนไขการรันงาน </label>
            <textarea class="form-control" rows="3" [formControl]="decisionAuthorityRemarks"
              placeholder="หมายเหตุเพิ่มเติม..."
              [class.is-invalid]="decisionAuthorityRemarks.invalid && decisionAuthorityRemarks.touched"></textarea>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeApproveModal()">ยกเลิก</button>

        <button type="button" class="btn btn-success" (click)="confirmApprove()"
          [disabled]="usedFile.invalid || colorSample.invalid || deadlineDate.invalid || deadlineTime.invalid || remarks.invalid || !decisionAuthority.value">
          ยืนยันอนุมัติ
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showRejectModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">ไม่ผ่าน - เลือกหน่วยงาน</h5>
        <button type="button" class="btn-close" (click)="closeRejectModal()"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-4">เลือกหน่วยงานที่ต้องการส่งต่อ:</p>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-warning btn-lg" (click)="openDesignModal()">
            ส่งไปฝ่ายออกแบบ
          </button>
          <button type="button" class="btn btn-info btn-lg" (click)="openPlanModal()">
            ส่งไปฝ่ายแผน
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeRejectModal()">ยกเลิก</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showDesignModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">ส่งไปฝ่ายออกแบบ</h5>
        <button type="button" class="btn-close" (click)="closeDesignModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ต้องส่ง <span style="color: red;">*</span></label>
            <input type="date" class="form-control" [formControl]="designDate"
              [class.is-invalid]="designDate.invalid && designDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลาที่ต้องส่ง <span style="color: red;">*</span></label>
            <input type="time" class="form-control" [formControl]="designTime"
              [class.is-invalid]="designTime.invalid && designTime.touched">
          </div>
          <div class="col-12"
            *ngIf="mainForm.getRawValue().designOrderId == null || mainForm.getRawValue().designOrderId == ''">
            <label class="form-label font-weight-bold">รายละเอียดงาน <span style="color: red;">*</span></label>
            <input type="text" class="form-control" [formControl]="details"
              [class.is-invalid]="details.invalid && details.touched">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุในการขอแก้ไข <span style="color: red;">*</span></label>
            <textarea class="form-control" rows="3" [formControl]="designRemarks"
              placeholder="ระบุหมายเหตุในการขอแก้ไข..."
              [class.is-invalid]="designRemarks.invalid && designRemarks.touched"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDesignModal()">ยกเลิก</button>
        <button type="button" class="btn btn-warning" (click)="confirmSendToDesign()"
          [disabled]="designDate.invalid || designTime.invalid || designRemarks.invalid ">
          ยืนยันส่ง
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showPlanModal" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">ส่งไปฝ่ายแผน</h5>
        <button type="button" class="btn-close" (click)="closePlanModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label font-weight-bold">วันที่ต้องส่ง <span class="text-danger">*</span></label>
            <input type="date" class="form-control" [formControl]="planDate"
              [class.is-invalid]="planDate.invalid && planDate.touched">
          </div>
          <div class="col-6">
            <label class="form-label font-weight-bold">เวลาที่ต้องส่ง <span class="text-danger">*</span></label>
            <input type="time" class="form-control" [formControl]="planTime"
              [class.is-invalid]="planTime.invalid && planTime.touched">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-12">
            <label class="form-label font-weight-bold">หมายเหตุ <span class="text-danger">*</span></label>
            <textarea class="form-control" rows="3" [formControl]="planRemarks" placeholder="ระบุหมายเหตุ..."
              [class.is-invalid]="planRemarks.invalid && planRemarks.touched"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closePlanModal()">ยกเลิก</button>
        <button type="button" class="btn btn-info" (click)="confirmSendToPlan()"
          [disabled]="planDate.invalid || planTime.invalid || planRemarks.invalid">
          ยืนยันส่ง
        </button>
      </div>
    </div>
  </div>
</div>
