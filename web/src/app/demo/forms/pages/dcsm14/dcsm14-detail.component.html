<form [formGroup]="printingForm" (ngSubmit)="onSubmit()">
  <div class="card-body">
    <div class="card total-income-card warning overflow-hidden">
      <div class="position">
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
      <div class="padding">
        <h5 class="card-title mb-3">บันทึกงานพิมพ์  (Printing)</h5>
        
        <div class="row g-3">
          <div class="col-md-2">
            <label class="form-label">ลำดับ</label>
            <input type="number" class="form-control" formControlName="id" >
          </div>

          <div class="col-md-2">
            <label class="form-label">วันที่รายงาน<span style="color: red;">*</span></label>
            <input type="date" class="form-control" formControlName="reportDate" 
              [class.is-invalid]="printingForm.get('reportDate')?.invalid && printingForm.get('reportDate')?.touched">
          </div>

          <div class="col-md-2">
            <label class="form-label">เลขที่ใบสั่งงาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="jobOrderNo" 
              [class.is-invalid]="printingForm.get('jobOrderNo')?.invalid && printingForm.get('jobOrderNo')?.touched">
          </div>

          <div class="col-md-6">
            <label class="form-label">ชื่องาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="jobName" 
              [class.is-invalid]="printingForm.get('jobName')?.invalid && printingForm.get('jobName')?.touched">
          </div>

          <div class="col-md-3">
            <label class="form-label">จำนวนสี<span style="color: red;">*</span></label>
            <input type="number" class="form-control" formControlName="colorCount" 
              [class.is-invalid]="printingForm.get('colorCount')?.invalid && printingForm.get('colorCount')?.touched">
          </div>

          <div class="col-md-3">
            <label class="form-label">เวลาเริ่มต้น<span style="color: red;">*</span></label>
            <input type="time" class="form-control" formControlName="startTime" 
              (change)="calculateTotalTime()"
              [class.is-invalid]="printingForm.get('startTime')?.invalid && printingForm.get('startTime')?.touched">
          </div>

          <div class="col-md-3">
            <label class="form-label">เวลาสิ้นสุด<span style="color: red;">*</span></label>
            <input type="time" class="form-control" formControlName="endTime" 
              (change)="calculateTotalTime()"
              [class.is-invalid]="printingForm.get('end_time')?.invalid && printingForm.get('end_time')?.touched">
          </div>

          <div class="col-md-3">
            <label class="form-label">เวลารวม</label>
            <input type="text" class="form-control bg-light" formControlName="totalTime">
          </div>

          <div class="col-md-3">
            <label class="form-label">จำนวน<span style="color: red;">*</span></label>
            <input type="number" class="form-control" formControlName="quantity" 
              [class.is-invalid]="printingForm.get('quantity')?.invalid && printingForm.get('quantity')?.touched">
          </div>

          <div class="col-md-6">
            <label class="form-label">ชื่อผู้รายงาน<span style="color: red;">*</span></label>
            <input type="text" class="form-control" formControlName="reporterName" 
              [class.is-invalid]="printingForm.get('reporterName')?.invalid && printingForm.get('reporterName')?.touched">
          </div>

          <div class="col-md-12">
            <label class="form-label">หมายเหตุ</label>
            <textarea class="form-control" formControlName="remarks" rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
