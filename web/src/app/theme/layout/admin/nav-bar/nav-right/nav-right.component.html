<div class="ms-auto">
  <ul class="list-unstyled d-flex align-items-center mb-0 gap-2">
    <li *ngIf="isApprover">
      <a routerLink="/leave-approval"
        class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1 position-relative"
        title="อนุมัติการลา">
        <i class="ti ti-checklist"></i>
        <span>อนุมัติการลา</span>
        <span *ngIf="pendingCount > 0"
          class="position-absolute top-0 start-0 translate-middle badge rounded-pill bg-danger">
          {{ pendingCount }}
          <span class="visually-hidden">คำขอรออนุมัติ</span>
        </span>
      </a>
    </li>
    <li>
      <div class="dropdown pc-h-item header-user-profile" ngbDropdown>
        <a
          class="pc-head-link head-link-primary dropdown-toggle arrow-none me-0"
          data-bs-toggle="dropdown"
          ngbDropdownToggle
        >
          <img src="assets/images/user/avatar-2.jpg" alt="user-image" class="user-avtar" />
          <span>
            <i class="ti ti-settings"></i>
          </span>
        </a>
        <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
          <div class="dropdown-header">
            <h4>
              Good Morning,
              <span class="small text-muted">{{ userName }}</span>
            </h4>
            <!-- <p class="text-muted">{{ userRole }}</p> -->
            <hr />
            <ng-scrollbar style="height: calc(100vh - 280px)" visibility="hover">
              <a routerLink="/leave-request" class="dropdown-item" style="cursor: pointer;">
                <i class="ti ti-calendar-off"></i>
                <span>บันทึกการลา</span>
              </a>
              <a (click)="logout()" class="dropdown-item" style="cursor: pointer;">
                <i class="ti ti-logout"></i>
                <span>Logout</span>
              </a>
            </ng-scrollbar>
          </div>
        </div>
      </div>
    </li>
  </ul>
</div>
