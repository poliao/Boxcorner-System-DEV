<div class="mat-elevation-z2" style="font-family: 'Prompt', sans-serif;">
  <div class="desktop-table card total-income-card warning overflow-hidden">
    <table mat-table [dataSource]="dataSource"
      style="border-collapse: collapse; border: 2px solid #ddd; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">

      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef
          [style]="(col.headerStyle || headerStyle) + ' font-family: Prompt, sans-serif; font-weight: bold; padding: 16px; text-align: center; border-right: 1px solid white;'">
          {{ col.label }}
        </th>
        
        <td mat-cell *matCellDef="let row" 
          [class.clickable]="clickableColumn === col.key"
          [style]="'font-family: Prompt, sans-serif; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; padding: 12px 16px; text-align: center;' + (clickableColumn === col.key ? ' cursor: pointer; color: #171851; text-decoration: underline;' : '') + (col.colorFunction ? ' color: ' + col.colorFunction(row[col.key]) + '; font-weight: bold;' : '')"
          [ngStyle]="col.styleFunction ? col.styleFunction(col.key, row) : {}"
          (click)="onRowClick(row, col.key)">
          {{ row[col.key] || '-' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns();"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="getDisplayedColumns().length" style="padding: 20px; text-align: center; font-family: 'Prompt', sans-serif;">
          ไม่พบข้อมูลที่ค้นหา
        </td>
      </tr>
    </table>
  </div>

  <div class="mobile-cards" style="font-family: 'Prompt', sans-serif;">
    <div class="recipe-card" *ngFor="let row of dataSource.data">
      <div class="card-header">
        <span class="recipe-id" 
          [class.clickable]="clickableColumn === columns[0]?.key"
          (click)="onRowClick(row, columns[0]?.key)">
          {{ row[columns[0]?.key] }}
        </span>
      </div>
      <div class="card-content">
        <div class="recipe-info">
          <div class="info-item" *ngFor="let col of columns.slice(1)">
            <span class="label">{{ col.label }}:</span>
            <span class="value" [style]="col.colorFunction ? 'color: ' + col.colorFunction(row[col.key]) + '; font-weight: bold;' : ''">{{ row[col.key] || '-' }}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="no-data" *ngIf="dataSource.data.length === 0" style="padding: 20px; text-align: center;">
      ไม่พบข้อมูลที่ค้นหา
    </div>
  </div>

  <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions" showFirstLastButtons aria-label="Select page">
  </mat-paginator>
</div>
