name: CI/CD Pipeline to EC2 (Monorepo)

# ทำงานเมื่อมีการ Push โค้ดเข้า Branch 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. ดึงโค้ดล่าสุดมาที่ตัวรันเนอร์
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. ล็อกอินเข้า Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build และ Push Image สำหรับ Backend (Spring Boot)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: . # ใช้โฟลเดอร์หลัก
          file: ./Dockerfile # ชี้ไปที่ Dockerfile ของ Java
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-backend:latest

      # 4. Build และ Push Image สำหรับ Frontend (Angular)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend # ชี้ไปที่โฟลเดอร์ frontend
          file: ./frontend/Dockerfile # ชี้ไปที่ Dockerfile ของ Angular
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest

      # 5. SSH เข้าไปที่ EC2 เพื่อรันระบบใหม่ด้วย Docker Compose
      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/app
            
            docker-compose pull
            
            docker-compose up -d