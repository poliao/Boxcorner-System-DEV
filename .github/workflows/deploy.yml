name: CI/CD Pipeline to EC2

# ทำงานเมื่อมีการ Push โค้ดเข้า Branch 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. ดึงโค้ดล่าสุดมาที่ตัวรันเนอร์
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. ล็อกอินเข้า Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build และ Push Image ขึ้น Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # เปลี่ยน 'my-app' เป็นชื่อแอปของคุณ
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest 

      # 4. SSH เข้าไปที่ EC2 เพื่ออัปเดตระบบ
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # โหลด Image ล่าสุด
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            
            # หยุดและลบ Container ตัวเก่า (ถ้ามี)
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # รัน Container ตัวใหม่ (สมมติว่าแอปใช้พอร์ต 80)
            docker run -d --name my-app-container -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-app:latest